<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1220"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Tests CD"><title>Tests CD</title><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.png"><style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#0b1220;--muted:#5b6b7f;--brand:#1d4ed8;--ok:#15803d;--bad:#b91c1b;--warn:#b45309;--line:#e3e8ef}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;background:#0b1220;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;z-index:30}header h1{font-size:18px;margin:0}
main{max-width:820px;margin:auto;padding:14px 14px 100px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(11,18,32,.06);animation:fade .15s ease}@keyframes fade{from{opacity:.4;transform:translateY(3px)}to{opacity:1}}
h2{font-size:19px;margin:2px 0 10px}h3{margin:0 0 6px;font-size:15px}
button{font:inherit;border:0;border-radius:12px;padding:12px 14px;background:var(--brand);color:#fff;font-weight:600;width:100%;cursor:pointer;transition:transform .08s}button:active{transform:scale(.98)}
button.secondary{background:#e8edff;color:var(--brand)}button.ghost{background:#eef2f6;color:var(--ink)}button.danger{background:#fee2e2;color:var(--bad)}button:disabled{opacity:.4}
.row{display:flex;gap:8px}.row>*{flex:1}
input,select{font:inherit;width:100%;padding:11px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);margin-bottom:8px}label{font-size:12px;color:var(--muted);display:block;margin:6px 0 4px}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:14px;padding:13px;margin:9px 0;background:#fff;color:var(--ink);font-weight:500;transition:.12s}
.opt.sel{border-color:var(--brand);background:#eef4ff}.opt.ok{border-color:var(--ok);background:#f0fdf4}.opt.ko{border-color:var(--bad);background:#fef2f2}
.badge{display:inline-block;padding:3px 8px;border-radius:99px;font-size:11px;font-weight:700;background:#e8edff;color:var(--brand)}.b-gray{background:#eef2f6;color:var(--muted)}.b-green{background:#dcfce7;color:var(--ok)}.b-red{background:#fee2e2;color:var(--bad)}.b-amber{background:#fef3c7;color:var(--warn)}
.bar{height:7px;background:#e3e8ef;border-radius:99px;overflow:hidden;margin:8px 0}.bar>i{display:block;height:100%;background:var(--brand);transition:width .2s}
.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:40;padding-bottom:env(safe-area-inset-bottom)}.tabs button{background:none;color:var(--muted);border-radius:0;padding:9px 2px;font-size:10px;font-weight:700}.tabs button.on{color:var(--brand)}
.muted{color:var(--muted);font-size:12px}.stat{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}.stat:last-child{border:0}
.sheet{position:fixed;inset:0;background:rgba(11,18,32,.45);z-index:50}.inner{position:absolute;bottom:0;left:0;right:0;background:#fff;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}.inner button{margin-bottom:8px}
</style></head><body><header><h1>Tests CD</h1><span id="net" class="badge b-gray">local</span></header><main id="app"></main>
<nav class="tabs" id="tabs"></nav><div id="modal"></div>
<script>
const DEF={tests:[],attempts:[],qs:{},favs:[],set:{penalty:0}};let DB=null,S=null,R={name:'home'},busy=false;
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&','<':'<','>':'>','"':'"',"'":'&#39;'}[c]))}
const app=document.getElementById('app'),tabs=document.getElementById('tabs'),modal=document.getElementById('modal');
const DEMO={id:'demo',category:'oficial',origin:'Datos de prueba',year:2025,type:'Demo',name:'Test ficticio de demostración',topic:'General',importedAt:new Date().toISOString(),reviewed:true,source:'Datos ficticios',scoring:{countable:5,pointsPerCorrect:1,penaltyPerWrong:0,blank:0,maxScore:5,scale:10},questions:[
{id:'d1',number:1,stem:'¿Cuál es la capital de Australia?',options:{A:'Sídney',B:'Canberra',C:'Melbourne',D:'Perth'},correct:'B',reserve:false,explanation:'Canberra fue diseñada como capital.'},
{id:'d2',number:2,stem:'¿Qué organismo publica el Índice de Paz Global?',options:{A:'Naciones Unidas',B:'Institute for Economics and Peace',C:'OTAN',D:'Banco Mundial'},correct:'B',reserve:false},
{id:'d3',number:3,stem:'¿Cuál es el océano más extenso?',options:{A:'Atlántico',B:'Índico',C:'Pacífico',D:'Ártico'},correct:'C',reserve:false},
{id:'d4',number:4,stem:'¿Qué país tiene más habitantes?',options:{A:'China',B:'India',C:'Estados Unidos',D:'Indonesia'},correct:'B',reserve:false},
{id:'d5',number:5,stem:'¿Cuál es la moneda de Japón?',options:{A:'Yuan',B:'Won',C:'Yen',D:'Rupia'},correct:'C',reserve:false},
{id:'d6',number:101,stem:'Reserva ficticia: ¿Qué tratado creó la ONU?',options:{A:'Tratado de Versalles',B:'Carta de las Naciones Unidas',C:'Tratado de Roma',D:'Tratado de Lisboa'},correct:'B',reserve:true}]};
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('testscd',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function idbGet(db,k){return new Promise((res,rej)=>{const t=db.transaction('kv','readonly').objectStore('kv').get(k);t.onsuccess=()=>res(t.result);t.onerror=()=>rej(t.error)})}
function idbPut(db,k,v){return new Promise((res,rej)=>{const t=db.transaction('kv','readwrite').objectStore('kv').put(k,v);t.onsuccess=()=>res();t.onerror=()=>rej(t.error)})}
let db=null;
async function save(){if(db)try{await idbPut(db,'db',DB)}catch(e){console.warn(e)}}
async function init(){db=await openDB();const d=await idbGet(db,'db');DB=d&&d.tests?d:{tests:[DEMO],attempts:[],qs:{},favs:[],set:{penalty:0}};if(!DB.tests.length)DB.tests=[DEMO];await save();render()}
const TABS=[['home','Inicio','🏠'],['tests','Test','📚'],['failed','Falladas','🔁'],['stats','Datos','📊'],['more','Más','☰']];
function tabsRender(){tabs.innerHTML=TABS.map(([k,l,i])=>`<button class="${(R.name==k||(k=='tests'&&(R.name=='official'||R.name=='academy'||R.name=='all'||R.name=='test')))?'on':''}" onclick="${k=='more'?'more()':`go('${k}')`}">${i}<br>${l}</button>`).join('')}
function go(n,p={}){if(busy)return;busy=true;closeModal();R={name:n,...p};window.scrollTo({top:0,behavior:'smooth'});setTimeout(()=>{render();busy=false},70)}
function path(t){return `${t.category=='oficial'?'Oficial':'Academia'} · ${t.origin||'—'} · ${t.year||'—'}`}
function qs(id){return DB.qs[id]||{seen:0,correct:0,wrong:0,blank:0,streak:0,last:null}}
function rec(id,r){const s=qs(id);s.seen++;s.last=new Date().toISOString();if(r=='ok'){s.correct++;s.streak=0}else if(r=='ko'){s.wrong++;s.streak++}else{s.blank++}DB.qs[id]=s;save()}
function score(t,a){const q=t.questions.filter(x=>!x.reserve);let c=0,w=0,b=0;q.forEach(x=>{const v=a[x.id];if(!v)b++;else if(v==x.correct)c++;else w++});const sc=t.scoring,raw=c*(sc.pointsPerCorrect??1)-w*(sc.penaltyPerWrong??0),max=sc.maxScore??sc.countable*(sc.pointsPerCorrect??1),pct=max?Math.max(0,raw/max)*100:0;return{correct:c,wrong:w,blank:b,raw,max,grade:sc.scale?Math.max(0,pct/100*sc.scale):pct}}
function attempts(t){return DB.attempts.filter(a=>a.testId==t.id)}
function lastResult(t){const a=attempts(t);return a.length?a[a.length-1].result:null}
function render(){if(!DB)return;tabsRender();document.getElementById('net').textContent=navigator.onLine?'local':'sin conexión';const r=R;if(S)return quiz();if(r.name=='home')return home();if(r.name=='tests')return library();if(r.name=='official')return library('oficial');if(r.name=='academy')return library('academia');if(r.name=='all')return library();if(r.name=='failed')return failed();if(r.name=='favorites')return favs();if(r.name=='stats')return stats();if(r.name=='manage')return manage();if(r.name=='settings')return settings();if(r.name=='test')return detail(r.id);if(r.name=='result')return result();home()}
function home(){const done=DB.attempts,g=done.map(a=>a.result.grade);app.innerHTML=`<div class="card"><h2>Hola</h2><p class="muted">Tu biblioteca de tests para preparar la Carrera Diplomática. Los datos se guardan en este iPhone.</p><div class="row"><button onclick="go('tests')">Biblioteca</button><button class="secondary" onclick="go('failed')">Repasar falladas</button></div></div><div class="card"><h3>Resumen</h3><div class="stat"><span>Test en la biblioteca</span><b>${DB.tests.length}</b></div><div class="stat"><span>Intentos realizados</span><b>${done.length}</b></div><div class="stat"><span>Nota media</span><b>${g.length?(g.reduce((a,b)=>a+b,0)/g.length).toFixed(2):'—'}</b></div><div class="stat"><span>Mejor nota</span><b>${g.length?Math.max(...g).toFixed(2):'—'}</b></div></div><div class="card"><h3>Últimos test</h3>${DB.tests.slice(-5).reverse().map(t=>{const lr=lastResult(t);return `<div class="stat"><span>${esc(t.name)}<br><span class="muted">${esc(path(t))}</span></span><b>${lr?lr.grade.toFixed(2):'—'}</b></div>`}).join('')}</div>`}
function library(cat){let ts=DB.tests.filter(t=>!cat||t.category==cat);const q=(R.q||'').toLowerCase(),y=R.year||'',o=R.origin||'',tp=R.topic||'',sort=R.sort||'recent';
if(q)ts=ts.filter(t=>JSON.stringify(t).toLowerCase().includes(q));if(y)ts=ts.filter(t=>String(t.year)==String(y));if(o)ts=ts.filter(t=>t.origin==o);if(tp)ts=ts.filter(t=>t.topic==tp);
if(sort=='best')ts=[...ts].sort((a,b)=>(lastResult(b)?.grade??-1)-(lastResult(a)?.grade??-1));else if(sort=='worst')ts=[...ts].sort((a,b)=>(lastResult(a)?.grade??99)-(lastResult(b)?.grade??99));else ts=[...ts].sort((a,b)=>new Date(b.importedAt)-new Date(a.importedAt));
const years=[...new Set(DB.tests.map(t=>t.year).filter(Boolean))].sort((a,b)=>b-a),origins=[...new Set(DB.tests.map(t=>t.origin).filter(Boolean))],topics=[...new Set(DB.tests.map(t=>t.topic).filter(Boolean))];
app.innerHTML=`<div class="card"><h2>${cat=='oficial'?'Oficiales':cat=='academia'?'Academias':'Biblioteca'}</h2><input placeholder="Buscar test, academia, tema..." value="${esc(R.q||'')}" oninput="R.q=this.value;render()"><div class="row"><select onchange="R.year=this.value;render()"><option value="">Año</option>${years.map(x=>`<option ${String(y)==String(x)?'selected':''}>${x}</option>`).join('')}</select><select onchange="R.origin=this.value;render()"><option value="">Academia</option>${origins.map(x=>`<option ${o==x?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="row"><select onchange="R.topic=this.value;render()"><option value="">Materia</option>${topics.map(x=>`<option ${tp==x?'selected':''}>${esc(x)}</option>`).join('')}</select><select onchange="R.sort=this.value;render()"><option value="recent" ${sort=='recent'?'selected':''}>Recientes</option><option value="best" ${sort=='best'?'selected':''}>Mejor nota</option><option value="worst" ${sort=='worst'?'selected':''}>Peor nota</option></select></div></div>`+ts.map(t=>{const lr=lastResult(t),f=t.questions.filter(q=>qs(q.id).wrong>0).length;return `<div class="card" onclick="go('test',{id:'${t.id}'})"><h3>${esc(t.name)}</h3><p class="muted">${esc(path(t))}${t.topic?' · '+esc(t.topic):''}</p><p><span class="badge">${t.questions.length} preg.</span> <span class="badge b-gray">${t.questions.filter(q=>q.reserve).length} reserva</span> ${lr?`<span class="badge ${lr.grade>=5?'b-green':'b-red'}">Última: ${lr.grade.toFixed(2)}</span>`:'<span class="badge b-amber">Sin hacer</span>'} ${f?`<span class="badge b-red">${f} falladas</span>`:''}</p></div>`}).join('')||'<div class="card"><p class="muted">No hay test que coincidan.</p></div>'}
function detail(id){const t=DB.tests.find(x=>x.id==id),A=attempts(t),best=A.length?Math.max(...A.map(a=>a.result.grade)):null,f=t.questions.filter(q=>qs(q.id).wrong>0).length;app.innerHTML=`<div class="card"><span class="badge">${t.category=='oficial'?'Oficial':'Academia'}</span> <span class="badge b-gray">${esc(t.year||'')}</span> ${t.reviewed?'<span class="badge b-green">Revisado</span>':'<span class="badge b-amber">Pendiente</span>'}<h2>${esc(t.name)}</h2><p class="muted">${esc(path(t))}${t.topic?' · '+esc(t.topic):''}</p><div class="stat"><span>Preguntas / reservas</span><b>${t.questions.length} / ${t.questions.filter(q=>q.reserve).length}</b></div><div class="stat"><span>Intentos / mejor nota</span><b>${A.length} / ${best??'—'}</b></div><div class="stat"><span>Última nota</span><b>${A.length?A[A.length-1].result.grade.toFixed(2):'—'}</b></div><div class="stat"><span>Importado</span><b>${new Date(t.importedAt).toLocaleDateString('es-ES')}</b></div></div><div class="card"><div class="row"><button onclick="start('${t.id}','exam')">Examen</button><button class="secondary" onclick="start('${t.id}','study')">Estudio</button></div><div class="row" style="margin-top:8px"><button class="ghost" onclick="start('${t.id}','failed')">Falladas</button><button class="ghost" onclick="start('${t.id}','reserve')">Reservas</button></div></div><div class="card"><h3>Historial</h3>${A.slice().reverse().map(a=>`<div class="stat"><span>${new Date(a.date).toLocaleString('es-ES')}<br><span class="muted">${a.mode} · ${a.result.correct}✓ ${a.result.wrong}✗ ${a.result.blank}○</span></span><b>${a.result.grade.toFixed(2)}</b></div>`).join('')||'<p class="muted">Sin intentos.</p>'}</div><div class="card"><div class="row"><button class="ghost" onclick="editTest('${t.id}')">Editar</button><button class="danger" onclick="delTest('${t.id}')">Eliminar</button></div></div>`}
function start(id,m){const t=DB.tests.find(x=>x.id==id);let q=t.questions.slice();if(m=='failed')q=q.filter(x=>{const s=qs(x.id);return s.wrong||s.blank});if(m=='reserve')q=q.filter(x=>x.reserve);if(m=='exam'||m=='study')q=q.filter(x=>!x.reserve);if(!q.length)return alert('No hay preguntas para este modo.');if(m=='exam'&&confirm('¿Mezclar preguntas?'))q=[...q].sort(()=>Math.random()-.5);S={t,m,q,a:{},mark:{},i:0,t0:Date.now()};R={name:'quiz'};render()}
function quiz(){const t=S.t,q=S.q[S.i],a=S.a[q.id],show=S.m=='study'&&a,last=S.i==S.q.length-1;
app.innerHTML=`<div class="card"><div class="row"><span class="badge">${S.m=='exam'?'Examen':S.m=='study'?'Estudio':S.m=='failed'?'Falladas':'Reservas'}</span><span class="muted">${S.i+1}/${S.q.length}</span></div><div class="bar"><div style="width:${(S.i+1)/S.q.length*100}%"></div></div><div id="qa"><h3>${esc(q.stem)}</h3>${Object.entries(q.options).map(([k,v])=>`<button id="o${k}" class="opt ${a==k?'sel':''} ${show?(k==q.correct?'ok':a==k?'ko':''):''}" onclick="pick('${k}')">${k}) ${esc(v)}</button>`).join('')}${show?`<p class="muted"><b>${a==q.correct?'Correcta':'Incorrecta'}.</b> Respuesta: ${q.correct}. ${q.explanation?esc(q.explanation):''}</p>`:''}</div><div class="row"><button class="ghost" onclick="mark()">${S.mark[q.id]?'Quitar marca':'Marcar'}</button><button class="ghost" onclick="fav()">${DB.favs.includes(q.id)?'Quitar':'Favorita'}</button></div><div class="row" style="margin-top:8px"><button class="ghost" onclick="move(-1)" ${S.i==0?'disabled':''}>Anterior</button>${last?`<button onclick="${S.m=='exam'?'confirmEnd()':'end()'}">Terminar</button>`:`<button onclick="move(1)">Siguiente</button>`}</div>${S.m=='exam'?`<button class="ghost" style="margin-top:8px" onclick="confirmEnd()">Entregar</button>`:''}</div>`}
function pick(k){if(!S)return;const q=S.q[S.i];S.a[q.id]=k;document.querySelectorAll('.opt').forEach(b=>b.classList.remove('sel','ok','ko'));document.getElementById('o'+k).classList.add('sel');if(S.m=='study'){rec(q.id,k==q.correct?'ok':'ko');Object.keys(q.options).forEach(x=>{const b=document.getElementById('o'+x);if(x==q.correct)b.classList.add('ok');else if(x==k)b.classList.add('ko')});const p=document.createElement('p');p.className='muted';p.innerHTML=`<b>${k==q.correct?'Correcta':'Incorrecta'}.</b> Respuesta: ${q.correct}. ${q.explanation?esc(q.explanation):''}`;document.getElementById('qa').appendChild(p)}save()}
function move(d){if(busy)return;busy=true;S.i=Math.min(S.q.length-1,Math.max(0,S.i+d));window.scrollTo({top:0,behavior:'smooth'});setTimeout(()=>{quiz();busy=false},90)}
function mark(){const q=S.q[S.i];S.mark[q.id]=!S.mark[q.id];quiz()}
function fav(){const q=S.q[S.i],i=DB.favs.indexOf(q.id);i>=0?DB.favs.splice(i,1):DB.favs.push(q.id);save();quiz()}
function confirmEnd(){if(confirm('¿Entregar? Las sin respuesta contarán como en blanco.'))end()}
function end(){const r=score(S.t,S.a);S.q.forEach(q=>{const v=S.a[q.id];rec(q.id,!v?'blank':v==q.correct?'ok':'ko')});const at={id:uid(),testId:S.t.id,mode:S.m,date:new Date().toISOString(),duration:Math.round((Date.now()-S.t0)/1000),answers:{...S.a},result:r};DB.attempts.push(at);save();S=null;R={name:'result',id:at.id};render()}
function result(){const at=DB.attempts.find(x=>x.id==R.id),t=DB.tests.find(x=>x.id==at.testId);app.innerHTML=`<div class="card"><h2>Resultado</h2><p class="muted">${esc(t.name)}</p><div class="stat"><span>Aciertos</span><b>${at.result.correct}</b></div><div class="stat"><span>Errores</span><b>${at.result.wrong}</b></div><div class="stat"><span>Blancos</span><b>${at.result.blank}</b></div><div class="stat"><span>Nota</span><b>${at.result.grade.toFixed(2)}</b></div><div class="stat"><span>Duración</span><b>${Math.floor(at.duration/60)} min ${at.duration%60} s</b></div></div><div class="card"><h3>Corrección</h3>${t.questions.filter(q=>!q.reserve).map(q=>{const a=at.answers[q.id],ok=a==q.correct;return `<div style="border-top:1px solid var(--line);padding:9px 0"><b>${q.number}. ${esc(q.stem)}</b><br><span class="badge ${!a?'b-gray':ok?'b-green':'b-red'}">${!a?'Blanco':ok?'Correcta':'Incorrecta'}</span> <span class="muted">Correcta: ${q.correct}</span></div>`}).join('')}</div><div class="row"><button onclick="go('home')">Inicio</button><button class="secondary" onclick="go('failed')">Falladas</button></div>`}
function failed(){const items=[];DB.tests.forEach(t=>t.questions.forEach(q=>{const s=qs(q.id);if(s.wrong||s.blank)items.push({t,q,s})}));const y=R.year||'',o=R.origin||'';const years=[...new Set(items.map(x=>x.t.year))].sort((a,b)=>b-a),origins=[...new Set(items.map(x=>x.t.origin))];
app.innerHTML=`<div class="card"><h2>Preguntas falladas</h2><div class="row"><select onchange="R.year=this.value;render()"><option value="">Todos los años</option>${years.map(x=>`<option ${String(y)==String(x)?'selected':''}>${x}</option>`).join('')}</select><select onchange="R.origin=this.value;render()"><option value="">Todas</option>${origins.map(x=>`<option ${o==x?'selected':''}>${esc(x)}</option>`).join('')}</select></div></div>`+items.filter(x=>(!y||String(x.t.year)==String(y))&&(!o||x.t.origin==o)).map(({t,q,s})=>`<div class="card"><h3>${esc(q.stem)}</h3><p class="muted">${esc(t.name)} · ${esc(path(t))}</p><p><span class="badge b-green">${s.correct} aciertos</span> <span class="badge b-red">${s.wrong} errores</span> ${s.streak?`<span class="badge b-amber">${s.streak} seguidos</span>`:''}</p><div class="row"><button onclick="start('${t.id}','failed')">Practicar</button><button class="ghost" onclick="go('test',{id:'${t.id}'})">Ficha</button></div></div>`).join('')||'<div class="card"><p class="muted">No hay fallos.</p></div>'}
function favs(){const items=[];DB.tests.forEach(t=>t.questions.forEach(q=>{if(DB.favs.includes(q.id))items.push({t,q})}));app.innerHTML=`<div class="card"><h2>Marcadas</h2></div>`+items.map(({t,q})=>`<div class="card"><h3>${esc(q.stem)}</h3><p class="muted">${esc(t.name)}</p><div class="row"><button onclick="start('${t.id}','study')">Practicar</button><button class="ghost" onclick="unfav('${q.id}')">Quitar</button></div></div>`).join('')||'<div class="card"><p class="muted">Nada marcado.</p></div>'}
function unfav(id){DB.favs=DB.favs.filter(x=>x!=id);save();render()}
function stats(){const A=DB.attempts;if(!A.length)return app.innerHTML='<div class="card"><h2>Datos</h2><p class="muted">Haz un test para generar estadísticas.</p></div>';const g=A.map(a=>a.result.grade),ans=A.reduce((n,a)=>n+a.result.correct+a.result.wrong,0),c=A.reduce((n,a)=>n+a.result.correct,0),w=A.reduce((n,a)=>n+a.result.wrong,0),b=A.reduce((n,a)=>n+a.result.blank,0);
const byYear={},byOrigin={};A.forEach(a=>{const t=DB.tests.find(x=>x.id==a.testId);if(!t)return;(byYear[t.year]??=[]).push(a.result.grade);(byOrigin[t.origin||'—']??=[]).push(a.result.grade)});
const avg=x=>x.reduce((a,b)=>a+b,0)/x.length;
app.innerHTML=`<div class="card"><h2>Datos</h2><div class="stat"><span>Intentos</span><b>${A.length}</b></div><div class="stat"><span>Nota media</span><b>${(g.reduce((x,y)=>x+y,0)/g.length).toFixed(2)}</b></div><div class="stat"><span>Mejor</span><b>${Math.max(...g).toFixed(2)}</b></div><div class="stat"><span>Última</span><b>${g[g.length-1].toFixed(2)}</b></div><div class="stat"><span>Aciertos / errores</span><b>${c} / ${w}</b></div><div class="stat"><span>Blancos</span><b>${b}</b></div></div><div class="card"><h3>Por año</h3>${Object.entries(byYear).sort((a,b)=>b[0]-a[0]).map(([y,v])=>`<div class="stat"><span>${y}</span><b>${avg(v).toFixed(2)} · ${v.length} intentos</b></div>`).join('')}</div><div class="card"><h3>Por academia / origen</h3>${Object.entries(byOrigin).map(([o,v])=>`<div class="stat"><span>${esc(o)}</span><b>${avg(v).toFixed(2)} · ${v.length} intentos</b></div>`).join('')}</div><div class="card"><h3>Últimos intentos</h3>${A.slice(-10).reverse().map(a=>{const t=DB.tests.find(x=>x.id==a.testId);return `<div class="stat"><span>${esc(t.name)}<br><span class="muted">${new Date(a.date).toLocaleString('es-ES')}</span></span><b>${a.result.grade.toFixed(2)}</b></div>`}).join('')}</div>`}
function manage(){app.innerHTML=`<div class="card"><h2>Importar</h2><p class="muted">Importa archivos JSON preparados y revisados. Puedes importar tests de cualquier número de preguntas.</p><label>Archivo JSON</label><input type="file" id="f" accept=".json"><button onclick="imp()">Importar</button><button class="ghost" style="margin-top:8px" onclick="exp()">Exportar copia de seguridad</button></div><div class="card"><h3>Test</h3>${DB.tests.map(t=>`<div class="stat"><span>${esc(t.name)}<br><span class="muted">${esc(path(t))}</span></span><button class="ghost" style="width:auto;padding:8px" onclick="go('test',{id:'${t.id}'})">Abrir</button></div>`).join('')}</div>`}
function imp(){const f=document.getElementById('f').files[0];if(!f)return alert('Selecciona un JSON.');const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result),arr=Array.isArray(d)?d:[d];arr.forEach(t=>{if(!t.id)t.id=uid();if(!t.importedAt)t.importedAt=new Date().toISOString();DB.tests.push(t)});save();alert('Importado.');render()}catch(e){alert('Error: '+e.message)}};r.readAsText(f)}
function exp(){const b=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='tests-cd-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click()}
function settings(){app.innerHTML=`<div class="card"><h2>Ajustes</h2><p class="muted">Los datos se guardan localmente en este iPhone mediante IndexedDB, con más capacidad que el almacenamiento básico del navegador.</p><button class="ghost" onclick="exp()">Exportar copia</button><label>Restaurar copia</label><input type="file" id="r" accept=".json"><button class="danger" onclick="rest()">Restaurar</button></div>`}
function rest(){const f=document.getElementById('r').files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.tests)throw 0;DB=d;save();go('home')}catch(e){alert('Archivo no válido')}};r.readAsText(f)}
function editTest(id){const t=DB.tests.find(x=>x.id==id),n=prompt('Nombre:',t.name);if(n==null)return;const y=prompt('Año:',t.year);if(y==null)return;const o=prompt('Academia / organismo:',t.origin);if(o==null)return;const tp=prompt('Materia:',t.topic||'');if(tp==null)return;const p=prompt('Penalización:',t.scoring.penaltyPerWrong);if(p==null)return;Object.assign(t,{name:n,year:y,origin:o,topic:tp,scoring:{...t.scoring,penaltyPerWrong:+p||0}});save();render()}
function delTest(id){if(confirm('¿Eliminar test? El historial se conservará.')){DB.tests=DB.tests.filter(t=>t.id!=id);save();go('tests')}}
function more(){modal.innerHTML=`<div class="sheet" onclick="if(event.target==this)closeModal()"><div class="inner"><h3>Más</h3><button class="ghost" onclick="closeModal();go('official')">Oficiales</button><button class="ghost" onclick="closeModal();go('academy')">Academias</button><button class="ghost" onclick="closeModal();go('all')">Todos los test</button><button class="ghost" onclick="closeModal();go('favorites')">Marcadas</button><button class="ghost" onclick="closeModal();go('manage')">Importar</button><button class="ghost" onclick="closeModal();go('settings')">Ajustes</button><button class="secondary" onclick="closeModal()">Cerrar</button></div></div>`}
function closeModal(){modal.innerHTML=''}
window.addEventListener('online',()=>R&&render());window.addEventListener('offline',()=>R&&render());if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});init();
</script></body></html>
