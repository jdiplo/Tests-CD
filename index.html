<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f172a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="TestStudy"><title>TestStudy</title><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.png"><style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#0f172a;--muted:#64748b;--brand:#2563eb;--ok:#16a34a;--bad:#dc2626;--warn:#d97706;--line:#e2e8f0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;background:#0f172a;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;z-index:20}header h1{font-size:18px;margin:0}
main{max-width:760px;margin:auto;padding:16px 16px 95px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(15,23,42,.05);animation:fade .15s ease}
@keyframes fade{from{opacity:.35;transform:translateY(4px)}to{opacity:1;transform:none}}
h2{font-size:20px;margin:4px 0 12px}h3{margin:0 0 8px;font-size:16px}
button{font:inherit;border:0;border-radius:12px;padding:13px 16px;background:var(--brand);color:#fff;font-weight:600;width:100%;cursor:pointer;transition:transform .08s ease,background .15s ease}button:active{transform:scale(.98)}
button.secondary{background:#eef2ff;color:var(--brand)}button.ghost{background:#f1f5f9;color:var(--ink)}button.danger{background:#fee2e2;color:var(--bad)}button:disabled{opacity:.45}
.row{display:flex;gap:10px}.row>*{flex:1}
input,select{font:inherit;width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);margin-bottom:10px}label{display:block;font-size:13px;color:var(--muted);margin:8px 0 5px}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0;background:#fff;color:var(--ink);font-weight:500;transition:border-color .12s,background .12s}
.opt.selected{border-color:var(--brand);background:#eff6ff}.opt.correct{border-color:var(--ok);background:#f0fdf4}.opt.wrong{border-color:var(--bad);background:#fef2f2}
.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;background:#eef2ff;color:var(--brand)}.badge.gray{background:#f1f5f9;color:var(--muted)}.badge.green{background:#dcfce7;color:var(--ok)}.badge.red{background:#fee2e2;color:var(--bad)}.badge.amber{background:#fef3c7;color:var(--warn)}
.progress{height:8px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin:10px 0}.progress>div{height:100%;background:var(--brand);transition:width .18s ease}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom)}.nav button{background:none;color:var(--muted);border-radius:0;padding:10px 4px;font-size:11px}.nav button.active{color:var(--brand)}
.muted{color:var(--muted);font-size:13px}.stat{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}.stat:last-child{border:0}
</style></head><body><header><h1>TestStudy</h1><span id="net" class="badge gray">local</span></header><main id="app"></main><nav class="nav" id="nav"></nav>
<script>
const LS='teststudy_v3';const DEF={tests:[],attempts:[],qstats:{},favs:[],settings:{penalty:0}};let DB=load(),route={name:'home'},S=null,busy=false;
function load(){try{const d=JSON.parse(localStorage.getItem(LS));return d&&d.tests?d:structuredClone(DEF)}catch(e){return structuredClone(DEF)}}
function save(){localStorage.setItem(LS,JSON.stringify(DB))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&','<':'<','>':'>','"':'"',"'":'&#39;'}[c]))}
const app=document.getElementById('app'),nav=document.getElementById('nav');
const SAMPLE={id:'demo',category:'oficial',origin:'Datos de prueba',year:2025,type:'Demo',name:'Test ficticio de demostración',topic:'General',importedAt:new Date().toISOString(),reviewed:true,source:'Datos ficticios',scoring:{countable:5,pointsPerCorrect:1,penaltyPerWrong:0,blank:0,maxScore:5,scale:10},questions:[
{id:'q1',number:1,stem:'¿Cuál es la capital de Australia?',options:{A:'Sídney',B:'Canberra',C:'Melbourne',D:'Perth'},correct:'B',reserve:false,explanation:'Canberra fue diseñada como capital nacional.'},
{id:'q2',number:2,stem:'¿Qué organismo publica el Índice de Paz Global?',options:{A:'Naciones Unidas',B:'Institute for Economics and Peace',C:'OTAN',D:'Banco Mundial'},correct:'B',reserve:false},
{id:'q3',number:3,stem:'¿Cuál es el océano más extenso?',options:{A:'Atlántico',B:'Índico',C:'Pacífico',D:'Ártico'},correct:'C',reserve:false},
{id:'q4',number:4,stem:'¿Qué país tiene más habitantes?',options:{A:'China',B:'India',C:'Estados Unidos',D:'Indonesia'},correct:'B',reserve:false},
{id:'q5',number:5,stem:'¿Cuál es la moneda de Japón?',options:{A:'Yuan',B:'Won',C:'Yen',D:'Rupia'},correct:'C',reserve:false},
{id:'q6',number:101,stem:'Reserva ficticia: ¿Qué tratado creó la ONU?',options:{A:'Tratado de Versalles',B:'Carta de las Naciones Unidas',C:'Tratado de Roma',D:'Tratado de Lisboa'},correct:'B',reserve:true}]};
if(!DB.tests.length){DB.tests.push(SAMPLE);save()}
const NAV=[['home','Inicio'],['official','Oficiales'],['academy','Academias'],['all','Todos'],['failed','Falladas'],['favorites','Marcadas'],['stats','Estadísticas'],['manage','Importar'],['settings','Ajustes']];
function navRender(){document.getElementById('nav').innerHTML=NAV.map(([k,l])=>`<button class="${route.name===k?'active':''}" onclick="go('${k}')">${l}</button>`).join('')}
function go(n,p={}){if(busy)return;busy=true;route={name:n,...p};window.scrollTo({top:0,behavior:'smooth'});setTimeout(()=>{render();busy=false},80)}
function path(t){return t.category==='oficial'?`Oficiales / ${t.year||'—'} / ${t.type||'General'}`:`Academias / ${t.origin||'—'} / ${t.year||'—'} / ${t.type||'General'}`}
function qs(id){return DB.qstats[id]||{seen:0,correct:0,wrong:0,blank:0,streak:0,last:null}}
function rec(id,r){const s=qs(id);s.seen++;s.last=new Date().toISOString();if(r=='correct'){s.correct++;s.streak=0}else if(r=='wrong'){s.wrong++;s.streak++}else{s.blank++}DB.qstats[id]=s;save()}
function score(t,a){const q=t.questions.filter(x=>!x.reserve);let c=0,w=0,b=0;q.forEach(x=>{const v=a[x.id];if(!v)b++;else if(v==x.correct)c++;else w++});const sc=t.scoring,raw=c*(sc.pointsPerCorrect??1)-w*(sc.penaltyPerWrong??0),max=sc.maxScore??sc.countable*(sc.pointsPerCorrect??1),pct=max?Math.max(0,raw/max)*100:0;return{correct:c,wrong:w,blank:b,raw,max,grade:sc.scale?Math.max(0,pct/100*sc.scale):pct}}
function render(){navRender();document.getElementById('net').textContent=navigator.onLine?'local':'sin conexión';const r=route;if(S)return quiz();if(r.name=='home')return home();if(r.name=='official')return list('oficial');if(r.name=='academy')return list('academia');if(r.name=='all')return all();if(r.name=='failed')return failed();if(r.name=='favorites')return favs();if(r.name=='stats')return stats();if(r.name=='manage')return manage();if(r.name=='settings')return settings();if(r.name=='test')return detail(r.id);if(r.name=='result')return result();home()}
function home(){app.innerHTML=`<div class="card"><h2>Bienvenida</h2><p class="muted">Estudia con tus test de 100 preguntas y 5 reservas. Los datos permanecen en este dispositivo.</p><div class="row"><button onclick="go('official')">Oficiales</button><button class="secondary" onclick="go('academy')">Academias</button></div></div><div class="card"><h3>Acceso rápido</h3><div class="row"><button class="ghost" onclick="go('failed')">Falladas</button><button class="ghost" onclick="go('stats')">Estadísticas</button></div></div><div class="card"><div class="stat"><span>Test</span><b>${DB.tests.length}</b></div><div class="stat"><span>Intentos</span><b>${DB.attempts.length}</b></div><div class="stat"><span>Marcadas</span><b>${DB.favs.length}</b></div></div>`}
function list(c){const ts=DB.tests.filter(t=>t.category==c),ys=[...new Set(ts.map(t=>t.year))].sort((a,b)=>b-a);app.innerHTML=`<div class="card"><h2>${c=='oficial'?'Oficiales':'Academias'}</h2><input placeholder="Buscar..." value="${esc(route.q||'')}" oninput="route.q=this.value;render()"><select onchange="route.year=this.value;render()"><option value="">Todos los años</option>${ys.map(y=>`<option ${route.year==y?'selected':''}>${y}</option>`).join('')}</select></div>`+ts.filter(t=>(!route.q||JSON.stringify(t).toLowerCase().includes(route.q.toLowerCase()))&&(!route.year||t.year==route.year)).map(t=>`<div class="card"><h3>${esc(t.name)}</h3><p class="muted">${esc(path(t))}</p><p><span class="badge">${t.questions.length}</span> <span class="badge gray">${t.questions.filter(q=>q.reserve).length} reserva</span></p><div class="row"><button onclick="start('${t.id}','exam')">Examen</button><button class="secondary" onclick="start('${t.id}','study')">Estudio</button></div><div class="row" style="margin-top:10px"><button class="ghost" onclick="go('test',{id:'${t.id}'})">Ficha</button><button class="ghost" onclick="start('${t.id}','failed')">Falladas</button></div></div>`).join('')||'<div class="card"><p class="muted">No hay test.</p></div>'}
function all(){app.innerHTML=`<div class="card"><h2>Todos</h2><input placeholder="Buscar..." value="${esc(route.q||'')}" oninput="route.q=this.value;render()"></div>`+DB.tests.filter(t=>!route.q||JSON.stringify(t).toLowerCase().includes(route.q.toLowerCase())).map(t=>`<div class="card" onclick="go('test',{id:'${t.id}'})"><h3>${esc(t.name)}</h3><p class="muted">${esc(path(t))}</p></div>`).join('')}
function detail(id){const t=DB.tests.find(x=>x.id==id),a=DB.attempts.filter(x=>x.testId==id),best=a.length?Math.max(...a.map(x=>x.result.grade)):null;app.innerHTML=`<div class="card"><span class="badge">${t.category=='oficial'?'Oficial':'Academia'}</span> <span class="badge gray">${esc(t.year||'')}</span><h2>${esc(t.name)}</h2><p class="muted">${esc(path(t))}</p><div class="stat"><span>Preguntas</span><b>${t.questions.length}</b></div><div class="stat"><span>Reservas</span><b>${t.questions.filter(q=>q.reserve).length}</b></div><div class="stat"><span>Intentos / mejor nota</span><b>${a.length} / ${best??'—'}</b></div></div><div class="card"><div class="row"><button onclick="start('${t.id}','exam')">Examen</button><button class="secondary" onclick="start('${t.id}','study')">Estudio</button></div><div class="row" style="margin-top:10px"><button class="ghost" onclick="start('${t.id}','failed')">Falladas</button><button class="ghost" onclick="start('${t.id}','reserve')">Reservas</button></div></div><div class="card"><h3>Corrección</h3><div class="stat"><span>Puntuables</span><b>${t.scoring.countable}</b></div><div class="stat"><span>Penalización</span><b>${t.scoring.penaltyPerWrong}</b></div><div class="stat"><span>Escala</span><b>${t.scoring.scale||'%'}</b></div></div><div class="card"><div class="row"><button class="ghost" onclick="editTest('${t.id}')">Editar</button><button class="danger" onclick="delTest('${t.id}')">Eliminar</button></div></div>`}
function start(id,m){const t=DB.tests.find(x=>x.id==id);let q=t.questions.slice();if(m=='failed')q=q.filter(x=>{const s=qs(x.id);return s.wrong||s.blank});if(m=='reserve')q=q.filter(x=>x.reserve);if(m=='exam'||m=='study')q=q.filter(x=>!x.reserve);if(!q.length)return alert('No hay preguntas para este modo.');if(m=='exam'&&confirm('¿Mezclar preguntas?'))q=[...q].sort(()=>Math.random()-.5);S={t,m,q,a:{},mark:{},i:0,t0:Date.now()};route={name:'quiz'};render()}
function quiz(){const t=S.t,q=S.q[S.i],a=S.a[q.id],show=S.m=='study'&&a,last=S.i==S.q.length-1;
app.innerHTML=`<div class="card"><div class="row"><span class="badge">${S.m=='exam'?'Examen':S.m=='study'?'Estudio':S.m=='failed'?'Falladas':'Reservas'}</span><span class="muted">${S.i+1}/${S.q.length}</span></div><div class="progress"><div style="width:${(S.i+1)/S.q.length*100}%"></div></div><div id="qarea"><h3>${esc(q.stem)}</h3>${Object.entries(q.options).map(([k,v])=>`<button id="opt-${k}" class="opt ${a==k?'selected':''} ${show?(k==q.correct?'correct':a==k?'wrong':''):''}" onclick="pick('${k}')">${k}) ${esc(v)}</button>`).join('')}${show?`<p class="muted"><b>${a==q.correct?'Correcta':'Incorrecta'}.</b> Respuesta: ${q.correct}. ${q.explanation?esc(q.explanation):''}</p>`:''}</div><div class="row"><button class="ghost" onclick="mark()">${S.mark[q.id]?'Quitar marca':'Marcar'}</button><button class="ghost" onclick="fav()">${DB.favs.includes(q.id)?'Quitar favorita':'Favorita'}</button></div><div class="row" style="margin-top:10px"><button class="ghost" onclick="move(-1)" ${S.i==0?'disabled':''}>Anterior</button>${last?`<button onclick="${S.m=='exam'?'confirmEnd()':'end()'}">Terminar</button>`:`<button onclick="move(1)">Siguiente</button>`}</div>${S.m=='exam'?`<button class="ghost" style="margin-top:10px" onclick="confirmEnd()">Entregar</button>`:''}</div>`}
function pick(k){if(!S)return;const q=S.q[S.i];S.a[q.id]=k;document.querySelectorAll('.opt').forEach(b=>b.classList.remove('selected','correct','wrong'));const el=document.getElementById('opt-'+k);el.classList.add('selected');if(S.m=='study'){rec(q.id,k==q.correct?'correct':'wrong');Object.entries(q.options).forEach(([x])=>{const b=document.getElementById('opt-'+x);if(x==q.correct)b.classList.add('correct');else if(x==k)b.classList.add('wrong')});const p=document.createElement('p');p.className='muted';p.innerHTML=`<b>${k==q.correct?'Correcta':'Incorrecta'}.</b> Respuesta: ${q.correct}. ${q.explanation?esc(q.explanation):''}`;document.getElementById('qarea').appendChild(p)}save()}
function move(d){if(busy)return;busy=true;S.i=Math.min(S.q.length-1,Math.max(0,S.i+d));window.scrollTo({top:0,behavior:'smooth'});setTimeout(()=>{quiz();busy=false},100)}
function mark(){const q=S.q[S.i];S.mark[q.id]=!S.mark[q.id];quiz()}
function fav(){const q=S.q[S.id||S.q[S.i].id],i=DB.favs.indexOf(q.id);i>=0?DB.favs.splice(i,1):DB.favs.push(q.id);save();quiz()}
function confirmEnd(){if(confirm('¿Entregar? Las preguntas sin respuesta contarán como en blanco.'))end()}
function end(){const r=score(S.t,S.a);S.q.forEach(q=>{const v=S.a[q.id];rec(q.id,!v?'blank':v==q.correct?'correct':'wrong')});const at={id:uid(),testId:S.t.id,mode:S.m,date:new Date().toISOString(),duration:Math.round((Date.now()-S.t0)/1000),answers:{...S.a},result:r};DB.attempts.push(at);save();S=null;route={name:'result',id:at.id};render()}
function result(){const at=DB.attempts.find(x=>x.id==route.id),t=DB.tests.find(x=>x.id==at.testId);app.innerHTML=`<div class="card"><h2>Resultado</h2><p class="muted">${esc(t.name)}</p><div class="stat"><span>Aciertos</span><b>${at.result.correct}</b></div><div class="stat"><span>Errores</span><b>${at.result.wrong}</b></div><div class="stat"><span>Blancos</span><b>${at.result.blank}</b></div><div class="stat"><span>Nota</span><b>${at.result.grade.toFixed(2)}</b></div><div class="stat"><span>Duración</span><b>${Math.floor(at.duration/60)} min ${at.duration%60} s</b></div></div><div class="card"><h3>Corrección</h3>${t.questions.filter(q=>!q.reserve).map(q=>{const a=at.answers[q.id],ok=a==q.correct;return `<div style="border-top:1px solid var(--line);padding:10px 0"><b>${q.number}. ${esc(q.stem)}</b><br><span class="badge ${!a?'gray':ok?'green':'red'}">${!a?'Blanco':ok?'Correcta':'Incorrecta'}</span> <span class="muted">Correcta: ${q.correct}</span></div>`}).join('')}</div><div class="row"><button onclick="go('home')">Inicio</button><button class="secondary" onclick="go('failed')">Falladas</button></div>`}
function failed(){const items=[];DB.tests.forEach(t=>t.questions.forEach(q=>{const s=qs(q.id);if(s.wrong||s.blank)items.push({t,q,s})}));app.innerHTML=`<div class="card"><h2>Falladas</h2></div>`+items.map(({t,q,s})=>`<div class="card"><h3>${esc(q.stem)}</h3><p class="muted">${esc(t.name)}</p><p><span class="badge">${s.correct} aciertos</span> <span class="badge red">${s.wrong} errores</span></p><div class="row"><button onclick="start('${t.id}','failed')">Practicar</button><button class="ghost" onclick="go('test',{id:'${t.id}'})">Ficha</button></div></div>`).join('')||'<div class="card"><p class="muted">No hay fallos.</p></div>'}
function favs(){const items=[];DB.tests.forEach(t=>t.questions.forEach(q=>{if(DB.favs.includes(q.id))items.push({t,q})}));app.innerHTML=`<div class="card"><h2>Marcadas</h2></div>`+items.map(({t,q})=>`<div class="card"><h3>${esc(q.stem)}</h3><p class="muted">${esc(t.name)}</p><div class="row"><button onclick="start('${t.id}','study')">Practicar</button><button class="ghost" onclick="unfav('${q.id}')">Quitar</button></div></div>`).join('')||'<div class="card"><p class="muted">Nada marcado.</p></div>'}
function unfav(id){DB.favs=DB.favs.filter(x=>x!=id);save();render()}
function stats(){const A=DB.attempts;if(!A.length)return app.innerHTML='<div class="card"><h2>Estadísticas</h2><p class="muted">Haz un test.</p></div>';const g=A.map(a=>a.result.grade),ans=A.reduce((n,a)=>n+a.result.correct+a.result.wrong,0),c=A.reduce((n,a)=>n+a.result.correct,0),w=A.reduce((n,a)=>n+a.result.wrong,0),b=A.reduce((n,a)=>n+a.result.blank,0);app.innerHTML=`<div class="card"><h2>Estadísticas</h2><div class="stat"><span>Intentos</span><b>${A.length}</b></div><div class="stat"><span>Nota media</span><b>${(g.reduce((x,y)=>x+y,0)/g.length).toFixed(2)}</b></div><div class="stat"><span>Mejor</span><b>${Math.max(...g).toFixed(2)}</b></div><div class="stat"><span>Última</span><b>${g[g.length-1].toFixed(2)}</b></div><div class="stat"><span>% aciertos</span><b>${ans?(c/ans*100).toFixed(1):0}%</b></div><div class="stat"><span>Blancos</span><b>${b}</b></div></div><div class="card"><h3>Últimos intentos</h3>${A.slice(-10).map(a=>{const t=DB.tests.find(x=>x.id==a.testId);return `<div class="stat"><span>${esc(t.name)}</span><b>${a.result.grade.toFixed(2)}</b></div>`}).join('')}</div>`}
function manage(){app.innerHTML=`<div class="card"><h2>Importar</h2><label>Archivo JSON</label><input type="file" id="f" accept=".json"><button onclick="imp()">Importar</button><button class="ghost" style="margin-top:10px" onclick="exp()">Exportar copia</button></div><div class="card"><h3>Test</h3>${DB.tests.map(t=>`<div class="stat"><span>${esc(t.name)}</span><button class="ghost" style="width:auto;padding:8px" onclick="go('test',{id:'${t.id}'})">Abrir</button></div>`).join('')}</div>`}
function imp(){const f=document.getElementById('f').files[0];if(!f)return alert('Selecciona un JSON.');const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result),arr=Array.isArray(d)?d:[d];arr.forEach(t=>{if(!t.id)t.id=uid();if(!t.importedAt)t.importedAt=new Date().toISOString();DB.tests.push(t)});save();alert('Importado.');render()}catch(e){alert('Error: '+e.message)}};r.readAsText(f)}
function exp(){const b=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='teststudy-backup.json';a.click()}
function settings(){app.innerHTML=`<div class="card"><h2>Ajustes</h2><p class="muted">Los datos se guardan localmente.</p><button class="ghost" onclick="exp()">Exportar copia</button><label>Restaurar</label><input type="file" id="r" accept=".json"><button class="danger" onclick="rest()">Restaurar</button></div>`}
function rest(){const f=document.getElementById('r').files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.tests)throw 0;DB=d;save();go('home')}catch(e){alert('Archivo no válido')}};r.readAsText(f)}
function editTest(id){const t=DB.tests.find(x=>x.id==id),n=prompt('Nombre:',t.name);if(n==null)return;const y=prompt('Año:',t.year);if(y==null)return;const o=prompt('Origen:',t.origin);if(o==null)return;const p=prompt('Penalización:',t.scoring.penaltyPerWrong);if(p==null)return;Object.assign(t,{name:n,year:y,origin:o,scoring:{...t.scoring,penaltyPerWrong:+p||0}});save();render()}
function delTest(id){if(confirm('¿Eliminar test?')){DB.tests=DB.tests.filter(t=>t.id!=id);save();go('manage')}}
window.addEventListener('online',render);window.addEventListener('offline',render);if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});render();
</script></body></html>
