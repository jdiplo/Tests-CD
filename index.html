.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.grid button{padding:10px 2px;font-size:12px;border-radius:10px;box-shadow:none}

</style></head><body><header><h1>Tests <span>CD</span></h1><span id="net" class="badge b-gray">local</span><button class="hmenu" onclick="more()" aria-label="Menú">☰</button></header><main id="app"></main>
<nav class="tabs" id="tabs"></nav><div id="modal"></div>
<script>
const DEF={tests:[],attempts:[],qs:{},favs:[],set:{penalty:0,dark:false}};let DB=null,S=null,R={name:'home'},busy=false,timerId=null;
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&','<':'<','>':'>','"':'"',"'":'&#39;'}[c]))}
const app=document.getElementById('app'),tabs=document.getElementById('tabs'),modal=document.getElementById('modal');
const DEMO={id:'demo',category:'oficial',origin:'Datos de prueba',year:2025,type:'Demo',name:'Test ficticio de demostración',topic:'General',importedAt:new Date().toISOString(),reviewed:true,source:'Datos ficticios',scoring:{countable:5,pointsPerCorrect:1,penaltyPerWrong:0,blank:0,maxScore:5,scale:10},questions:[
{id:'d1',number:1,stem:'¿Cuál es la capital de Australia?',options:{A:'Sídney',B:'Canberra',C:'Melbourne',D:'Perth'},correct:'B',reserve:false,explanation:'Canberra fue diseñada como capital.'},
{id:'d2',number:2,stem:'¿Qué organismo publica el Índice de Paz Global?',options:{A:'Naciones Unidas',B:'Institute for Economics and Peace',C:'OTAN',D:'Banco Mundial'},correct:'B',reserve:false},
{id:'d3',number:3,stem:'¿Cuál es el océano más extenso?',options:{A:'Atlántico',B:'Índico',C:'Pacífico',D:'Ártico'},correct:'C',reserve:false},
{id:'d4',number:4,stem:'¿Qué país tiene más habitantes?',options:{A:'China',B:'India',C:'Estados Unidos',D:'Indonesia'},correct:'B',reserve:false},
{id:'d5',number:5,stem:'¿Cuál es la moneda de Japón?',options:{A:'Yuan',B:'Won',C:'Yen',D:'Rupia'},correct:'C',reserve:false},
{id:'d6',number:101,stem:'Reserva ficticia: ¿Qué tratado creó la ONU?',options:{A:'Tratado de Versalles',B:'Carta de las Naciones Unidas',C:'Tratado de Roma',D:'Tratado de Lisboa'},correct:'B',reserve:true}]};
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('testscd',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function idbGet(db,k){return new Promise((res,rej)=>{const t=db.transaction('kv','readonly').objectStore('kv').get(k);t.onsuccess=()=>res(t.result);t.onerror=()=>rej(t.error)})}
function idbPut(db,k,v){return new Promise((res,rej)=>{const t=db.transaction('kv','readwrite').objectStore('kv').put(v,k);t.onsuccess=()=>res();t.onerror=()=>rej(t.error)})}
let db=null;
async function save(){if(db)try{await idbPut(db,'db',DB)}catch(e){console.warn(e)}}
async function saveSession(){if(db&&S)await idbPut(db,'session',S)}
async function clearSession(){if(db)await idbPut(db,'session',null)}
async function init(){db=await openDB();const d=await idbGet(db,'db');DB=d&&d.tests?d:{tests:[DEMO],attempts:[],qs:{},favs:[],set:{penalty:0,dark:false}};if(!DB.tests.length)DB.tests=[DEMO];applyDark();const sv=await idbGet(db,'session');if(sv&&sv.q){if(confirm('Tienes un test sin terminar: '+sv.t.name+'. ¿Retomarlo?')){S=sv;R={name:'quiz'}}else await clearSession()}await save();render()}
const TABS=[['home','Inicio','🏠'],['tests','Test','📚'],['failed','Falladas','🔁'],['stats','Datos','📊'],['more','Más','☰']];
function tabsRender(){tabs.innerHTML=TABS.map(([k,l,i])=>`<button class="${(R.name==k||(k=='tests'&&(R.name=='official'||R.name=='academy'||R.name=='all'||R.name=='test')))?'on':''}" onclick="${k=='more'?'more()':`go('${k}')`}">${i}<br>${l}</button>`).join('')}
function go(n,p={}){if(busy)return;busy=true;closeModal();R={name:n,...p};window.scrollTo({top:0,behavior:'smooth'});setTimeout(()=>{render();busy=false},70)}
function path(t){return `${t.category=='oficial'?'Oficial':'Academia'} · ${t.origin||'—'} · ${t.year||'—'}`}
function qs(id){return DB.qs[id]||{seen:0,correct:0,wrong:0,blank:0,streak:0,last:null}}
function rec(id,r){const s=qs(id);s.seen++;s.last=new Date().toISOString();if(r=='ok'){s.correct++;s.streak=0}else if(r=='ko'){s.wrong++;s.streak++}else{s.blank++}DB.qs[id]=s;save()}
function score(t,a){const q=t.questions.filter(x=>!x.reserve);let c=0,w=0,b=0;q.forEach(x=>{const v=a[x.id];if(!v)b++;else if(v==x.correct)c++;else w++});const sc=t.scoring,raw=c*(sc.pointsPerCorrect??1)-w*(sc.penaltyPerWrong??0),max=sc.maxScore??sc.countable*(sc.pointsPerCorrect??1),pct=max?Math.max(0,raw/max)*100:0;return{correct:c,wrong:w,blank:b,raw,max,grade:sc.scale?Math.max(0,pct/100*sc.scale):pct}}
function attempts(t){return DB.attempts.filter(a=>a.testId==t.id)}
function lastResult(t){const a=attempts(t);return a.length?a[a.length-1].result:null}
function applyDark(){document.body.classList.toggle('dark',!!(DB&&DB.set.dark))}
function render(){if(!DB)return;applyDark();tabsRender();document.getElementById('net').textContent=navigator.onLine?'local':'sin conexión';const r=R;if(S)return quiz();if(r.name=='home')return home();if(r.name=='tests')return library();if(r.name=='official')return library('oficial');if(r.name=='academy')return library('academia');if(r.name=='all')return library();if(r.name=='failed')return failed();if(r.name=='favorites')return favs();if(r.name=='stats')return stats();if(r.name=='manage')return manage();if(r.name=='settings')return settings();if(r.name=='test')return detail(r.id);if(r.name=='result')return result();home()}
function home(){const done=DB.attempts,g=done.map(a=>a.result.grade);app.innerHTML=`<div class="card"><h2>Hola 👋</h2><p class="muted">Tu biblioteca de tests para preparar la Carrera Diplomática. Todo se guarda en este dispositivo.</p><div class="row"><button onclick="go('tests')">Biblioteca</button><button class="secondary" onclick="go('failed')">Repasar falladas</button></div></div><div class="card"><h3>Resumen</h3><div class="stat"><span>Test en la biblioteca</span><b>${DB.tests.length}</b></div><div class="stat"><span>Intentos realizados</span><b>${done.length}</b></div><div class="stat"><span>Nota media</span><b>${g.length?(g.reduce((a,b)=>a+b,0)/g.length).toFixed(2):'—'}</b></div><div class="stat"><span>Mejor nota</span><b>${g.length?Math.max(...g).toFixed(2):'—'}</b></div></div><div class="card"><h3>Últimos test</h3>${DB.tests.slice(-5).reverse().map(t=>{const lr=lastResult(t);return `<div class="stat"><span>${esc(t.name)}<br><span class="muted">${esc(path(t))}</span></span><b>${lr?lr.grade.toFixed(2):'—'}</b></div>`}).join('')}</div>`}
function library(cat){let ts=DB.tests.filter(t=>!cat||t.category==cat);const q=(R.q||'').toLowerCase(),y=R.year||'',o=R.origin||'',tp=R.topic||'',sort=R.sort||'recent';
if(q)ts=ts.filter(t=>JSON.stringify(t).toLowerCase().includes(q));if(y)ts=ts.filter(t=>String(t.year)==String(y));if(o)ts=ts.filter(t=>t.origin==o);if(tp)ts=ts.filter(t=>t.topic==tp);
if(sort=='best')ts=[...ts].sort((a,b)=>(lastResult(b)?.grade??-1)-(lastResult(a)?.grade??-1));else if(sort=='worst')ts=[...ts].sort((a,b)=>(lastResult(a)?.grade??99)-(lastResult(b)?.grade??99));else ts=[...ts].sort((a,b)=>new Date(b.importedAt)-new Date(a.importedAt));
const years=[...new Set(DB.tests.map(t=>t.year).filter(Boolean))].sort((a,b)=>b-a),origins=[...new Set(DB.tests.map(t=>t.origin).filter(Boolean))],topics=[...new Set(DB.tests.map(t=>t.topic).filter(Boolean))];
app.innerHTML=`<div class="card"><h2>${cat=='oficial'?'Oficiales':cat=='academia'?'Academias':'Biblioteca'}</h2><input placeholder="Buscar test, academia, tema..." value="${esc(R.q||'')}" oninput="R.q=this.value;render()"><div class="row"><select onchange="R.year=this.value;render()"><option value="">Año</option>${years.map(x=>`<option ${String(y)==String(x)?'selected':''}>${x}</option>`).join('')}</select><select onchange="R.origin=this.value;render()"><option value="">Academia</option>${origins.map(x=>`<option ${o==x?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="row"><select onchange="R.topic=this.value;render()"><option value="">Materia</option>${topics.map(x=>`<option ${tp==x?'selected':''}>${esc(x)}</option>`).join('')}</select><select onchange="R.sort=this.value;render()"><option value="recent" ${sort=='recent'?'selected':''}>Recientes</option><option value="best" ${sort=='best'?'selected':''}>Mejor nota</option><option value="worst" ${sort=='worst'?'selected':''}>Peor nota</option></select></div></div>`+ts.map(t=>{const lr=lastResult(t),f=t.questions.filter(q=>qs(q.id).wrong>0).length;return `<div class="card" onclick="go('test',{id:'${t.id}'})"><h3>${esc(t.name)}</h3><p class="muted">${esc(path(t))}${t.topic?' · '+esc(t.topic):''}</p><p style="margin:10px 0 0"><span class="badge">${t.questions.filter(q=>!q.reserve).length} preg.</span> <span class="badge b-gray">${t.questions.filter(q=>q.reserve).length} reserva</span> ${lr?`<span class="badge ${lr.grade>=5?'b-green':'b-red'}">Última: ${lr.grade.toFixed(2)}</span>`:'<span class="badge b-amber">Sin hacer</span>'} ${f?`<span class="badge b-red">${f} falladas</span>`:''}</p></div>`}).join('')||'<div class="card"><p class="muted">No hay test que coincidan.</p></div>'}
function detail(id){const t=DB.tests.find(x=>x.id==id),A=attempts(t),best=A.length?Math.max(...A.map(a=>a.result.grade)):null,f=t.questions.filter(q=>qs(q.id).wrong>0).length;app.innerHTML=`<div class="card"><span class="badge">${t.category=='oficial'?'Oficial':'Academia'}</span> <span class="badge b-gray">${esc(t.year||'')}</span> ${t.reviewed?'<span class="badge b-green">Revisado</span>':'<span class="badge b-amber">Pendiente</span>'}<h2>${esc(t.name)}</h2><p class="muted">${esc(path(t))}${t.topic?' · '+esc(t.topic):''}</p><div class="stat"><span>Se responden las 105; puntúan las 100 ordinarias</span><b>${t.questions.length} / ${t.questions.filter(q=>q.reserve).length}</b></div><div class="stat"><span>Intentos / mejor nota</span><b>${A.length} / ${best??'—'}</b></div><div class="stat"><span>Última nota</span><b>${A.length?A[A.length-1].result.grade.toFixed(2):'—'}</b></div><div class="stat"><span>Importado</span><b>${new Date(t.importedAt).toLocaleDateString('es-ES')}</b></div></div><div class="card"><div class="row"><button onclick="start('${t.id}','exam')">Examen</button><button class="secondary" onclick="start('${t.id}','study')">Estudio</button></div><div class="row" style="margin-top:10px"><button class="ghost" onclick="start('${t.id}','failed')">Falladas</button><button class="ghost" onclick="start('${t.id}','reserve')">Reservas</button></div></div><div class="card"><h3>Historial</h3>${A.slice().reverse().map(a=>`<div class="stat"><span>${new Date(a.date).toLocaleString('es-ES')}<br><span class="muted">${a.mode} · ${a.result.correct}✓ ${a.result.wrong}✗ ${a.result.blank}○</span></span><b>${a.result.grade.toFixed(2)}</b></div>`).join('')||'<p class="muted">Sin intentos.</p>'}</div><div class="card"><div class="row"><button class="ghost" onclick="editTest('${t.id}')">Editar</button><button class="danger" onclick="delTest('${t.id}')">Eliminar</button></div></div>`}
function start(id,m){const t=DB.tests.find(x=>x.id==id);let q=t.questions.slice();if(m=='failed')q=q.filter(x=>{const s=qs(x.id);return s.wrong||s.blank}).sort((a,b)=>(qs(b.id).streak-qs(a.id).streak)||(qs(b.id).wrong-qs(a.id).wrong));if(m=='reserve')q=q.filter(x=>x.reserve);if(m=='study')q=q.filter(x=>!x.reserve);if(!q.length)return alert('No hay preguntas para este modo.');
let timer=0;if(m=='exam'){const v=prompt('Minutos de temporizador (0 = sin límite):','0');timer=+v||0}
if(m=='exam'){const ord=q.filter(x=>!x.reserve),res=q.filter(x=>x.reserve);q=confirm('¿Mezclar las 100 preguntas ordinarias?')?[...ord.sort(()=>Math.random()-.5),...res]:[...ord,...res]}

function dayKey(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}

function shuffled(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a;}
function uniquePool(a){const seen=new Set();return a.filter(({q})=>{const k=q.stem.trim().toLowerCase().replace(/\s+/g,' ')+'|'+Object.values(q.options).map(v=>String(v).trim().toLowerCase()).sort().join('|');if(seen.has(k))return false;seen.add(k);return true})}

async function createMock(){try{const o=document.getElementById('mockOrigin').value,y=document.getElementById('mockYear').value,weak=document.getElementById('mockMode').value=='weak',avoid=+document.getElementById('mockAvoid').value,minutes=Math.max(0,+document.getElementById('mockMinutes').value||0),penalty=Math.max(0,+document.getElementById('mockPenalty').value||0);let all=uniquePool(pool().filter(x=>(!o||x.t.origin==o)&&(!y||String(x.t.year)==y)));if(!all.length)return alert('No hay preguntas reales en esta selección. Importa tus tests.');const recent=new Set(avoid?DB.mockRecent.slice(-avoid).flat():[]);let available=all.filter(x=>!recent.has(x.q.id));if(available.length<Math.min(105,all.length)&&recent.size){if(!confirm('No quedan suficientes preguntas al excluir las recientes. ¿Permitir reutilizarlas?'))return;available=all}if(available.length<105&&!confirm('Solo hay '+available.length+' preguntas únicas. ¿Crear un simulacro reducido sin reservas?'))return;available=shuffled(available);if(weak)available.sort((a,b)=>(qs(b.q.id).wrong-qs(a.q.id).wrong));const selected=available.slice(0,105),normal=selected.length==105?100:selected.length,q=selected.map((x,i)=>({...x.q,reserve:i>=normal,sourceTest:x.t.name}));const t={id:'mock-'+uid(),name:'Simulacro '+new Date().toLocaleString('es-ES'),questions:q,scoring:{countable:normal,pointsPerCorrect:1,penaltyPerWrong:penalty,maxScore:normal,scale:10}};ensureIds(t);DB.mockRecent.push(q.map(x=>x.id));DB.mockRecent=DB.mockRecent.slice(-3);S={t,m:'exam',kind:'mock',q,a:{},mark:{},i:0,t0:Date.now(),deadline:minutes?Date.now()+minutes*60000:0};R={name:'quiz'};await save();await saveSession();render()}catch(e){alert('No se pudo crear el simulacro: '+(e.message||e));busy=false}}

library=function(cat){const f=DB.set.filters||{},norm=x=>String(x??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();let ts=DB.tests.filter(t=>(!cat||t.category===cat)&&(!f.q||norm([t.name,t.origin,t.topic,t.year,...(meta12(t).tags||[])].join(' ')).includes(norm(f.q)))&&(!f.origin||t.origin===f.origin)&&(!f.year||String(t.year)===f.year)&&(!f.state||(f.state==='new'&&!attempts(t).length)||(f.state==='pin'&&meta12(t).pin)||(f.state==='pending'&&!t.reviewed)));ts.sort((a,b)=>Number(!!meta12(b).pin)-Number(!!meta12(a).pin)||(f.sort==='name'?a.name.localeCompare(b.name,'es',{numeric:true}):f.sort==='size'?b.questions.length-a.questions.length:(Date.parse(b.importedAt)||0)-(Date.parse(a.importedAt)||0)));const focused=document.activeElement?.id==='search12',pos=document.getElementById('search12')?.selectionStart;const select=(k,vals,title)=>`<label>${title}<select onchange="filter12('${k}',this.value)"><option value="">Todos</option>${vals.map(v=>`<option value="${esc(v)}" ${String(f[k])===String(v)?'selected':''}>${esc(v)}</option>`).join('')}</select></label>`;app.innerHTML=`<section class="card hero"><h2>Tu biblioteca</h2><p class="muted">${DB.tests.length} tests · ${ts.length} resultados</p><div class="row"><button onclick="go('manage')">Importar</button><button class="secondary" onclick="go('search12')">Buscar preguntas</button></div></section><section class="card"><label>Buscar<input id="search12" type="search" value="${esc(f.q||'')}" placeholder="Test, materia, etiqueta, año…" oninput="filter12('q',this.value)"></label><details><summary>Filtros y orden</summary><div class="progrid">${select('origin',[...new Set(DB.tests.map(t=>t.origin).filter(Boolean))],'Origen')}${select('year',[...new Set(DB.tests.map(t=>String(t.year)).filter(Boolean))].sort().reverse(),'Año')}<label>Estado<select onchange="filter12('state',this.value)">${[['','Todos'],['new','Sin hacer'],['pin','Fijados'],['pending','Sin marca de revisión']].map(([v,l])=>`<option value="${v}" ${f.state===v?'selected':''}>${l}</option>`).join('')}</select></label><label>Orden<select onchange="filter12('sort',this.value)">${[['recent','Recientes'],['name','Nombre'],['size','Preguntas']].map(([v,l])=>`<option value="${v}" ${f.sort===v?'selected':''}>${l}</option>`).join('')}</select></label></div><button class="ghost" onclick="DB.set.filters={};save();render()">Limpiar filtros</button></details></section><div class="progrid">${ts.map(t=>{const i=DB.tests.indexOf(t),seen=t.questions.filter(q=>qs(q.id).seen).length;return `<article class="card"><span class="badge">${esc(t.origin||t.category)}</span> ${Date.now()-Date.parse(t.importedAt)<604800000?'<span class="badge b-green">Nuevo</span>':''}<h3>${esc(t.name)}</h3><p class="muted">${esc(t.year)} · ${t.questions.length} preguntas · ${seen} practicadas</p><p class="muted">${(meta12(t).tags||[]).map(esc).join(' · ')}</p><button onclick="go('test',{id:DB.tests[${i}].id})">Abrir →</button><div class="row tools"><button class="ghost" onclick="pin12(${i})">${meta12(t).pin?'★ Fijado':'☆ Fijar'}</button><button class="ghost" onclick="label12(${i})">Etiquetas</button></div><label><input type="checkbox" data-export="${i}" style="width:auto"> Seleccionar para exportar</label></article>`;}).join('')||'<p>No hay coincidencias. Prueba a limpiar filtros.</p>'}</div><button class="secondary" onclick="exportSelection()">Exportar selección</button>`;if(focused){const el=document.getElementById('search12');el.focus();el.setSelectionRange(pos,pos);}};
const detail12=detail;detail=function(id){detail12(id);const i=DB.tests.findIndex(t=>t.id===id),t=DB.tests[i];const textNode=[...app.querySelectorAll('.stat span')].find(e=>e.textContent.includes('Se responden las 105'));if(textNode)textNode.textContent=`${t.questions.length} preguntas; ${t.questions.filter(q=>!q.reserve).length} ordinarias puntuables`;app.insertAdjacentHTML('afterbegin',sessions12For(id));app.insertAdjacentHTML('beforeend',`<div class="card"><button class="ghost" onclick="exportOne12(${i})">Exportar este test</button><button class="ghost" onclick="restart12(${i})">Empezar estudio de nuevo</button></div>`);};
function sessions12For(id){return Object.entries(DB.sessions).filter(([k,x])=>x.t.id===id).map(([k,x])=>`<div class="card"><p>Sesión guardada · ${Object.keys(x.a).length}/${x.q.length}</p><button onclick='resume12(${esc(JSON.stringify(k))})'>Continuar ${esc(x.m)}</button></div>`).join('');}
function restart12(i){const id=DB.tests[i].id;if(DB.sessions[id+'::study']&&!confirm('¿Sustituir el estudio guardado? Se perderán sus respuestas, no el historial.'))return;delete DB.sessions[id+'::study'];save();configure12(id,'study');}
function searchQuestions12(){const value=R.query||'',n=value.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();const items=n?pool().filter(({q})=>(q.stem+' '+Object.values(q.options).join(' ')+' '+(q.explanation||'')).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().includes(n)).slice(0,60):[];app.innerHTML=`<section class="card"><h2>Buscar preguntas</h2><label>Término<input id="pq12" value="${esc(value)}" type="search" oninput="R.query=this.value;searchQuestions12()"></label><p class="muted">Hasta 60 resultados. Abre un estudio de una pregunta, sin modificar otras sesiones.</p></section>${items.map(({t,q})=>`<article class="card"><p class="muted">${esc(t.name)}</p><h3>${esc(q.stem)}</h3><button onclick='openQuestion12(${esc(JSON.stringify(q.id))})'>Practicar esta pregunta</button></article>`).join('')}`;if(value){const el=document.getElementById('pq12');el.focus();el.setSelectionRange(value.length,value.length);}}
function openQuestion12(id){launchPool12(pool().filter(x=>x.q.id===id),'Pregunta individual','single-'+id);}
let flash12items=[],flash12index=0,flash12back=false;
function flashcards12(source){flash12items=pool().filter(({q})=>source==='marked'?DB.favs.includes(q.id):qs(q.id).wrong>0);flash12index=0;flash12back=false;showFlash12();}
function showFlash12(){R={name:'flash12'};tabsRender();const x=flash12items[flash12index];app.innerHTML=`<section class="card"><h2>Tarjetas de repaso</h2><p class="muted">Lectura sin nota ni XP.</p><div class="row"><button class="ghost" onclick="flashcards12('marked')">Marcadas</button><button class="ghost" onclick="flashcards12('failed')">Falladas</button></div></section><section class="card">${x?`<p class="muted">${flash12index+1}/${flash12items.length} · ${esc(x.t.name)}</p><h3>${esc(x.q.stem)}</h3>${flash12back?`<p>${esc(x.q.correct)} · ${esc(x.q.options[x.q.correct])}</p><p>${esc(x.q.explanation||'Sin explicación')}</p>`:''}<button onclick="flash12back=!flash12back;showFlash12()">${flash12back?'Ocultar':'Voltear'}</button><button class="ghost" onclick="flash12index=(flash12index+1)%flash12items.length;flash12back=false;showFlash12()">Siguiente</button>`:'No hay preguntas de este tipo.'}</section>`;}
const more12=more;more=function(){more12();document.querySelector('.inner').insertAdjacentHTML('beforeend',`<div class="row"><button class="ghost" onclick="closeModal();go('search12')">Buscar preguntas</button><button class="ghost" onclick="closeModal();practiceFav12()">Repasar marcadas</button><button class="ghost" onclick="closeModal();flashcards12('failed')">Flashcards</button></div>`);};
const render12=render;render=function(){if(!DB)return;applyDark();if(!S&&R.name==='search12'){tabsRender();return searchQuestions12();}if(!S&&R.name==='flash12')return showFlash12();render12();};
const stats12=stats;stats=function(){stats12();const recent=DB.attempts.filter(a=>(a.mode==='exam'||a.mode==='mock')&&a.result).slice(-20);const points=recent.map((a,i)=>`${35+i*430/Math.max(1,recent.length-1)},${145-120*(Number(a.result.grade)/(a.scale||10))}`).join(' ');const days=Array.from({length:7},(_,i)=>plusDays(i-6));const counts=days.map(d=>DB.events.filter(e=>dayKey(new Date(e.date))===d).length);const max=Math.max(1,...counts);app.insertAdjacentHTML('afterbegin',`<section class="card"><h2>Tu progreso, sin ruido</h2><h3>Actividad de los últimos 7 días</h3><div class="weekchart" role="img" aria-label="Preguntas registradas por día">${days.map((d,i)=>`<div><span>${counts[i]}</span><i style="height:${Math.max(2,90*counts[i]/max)}px"></i><small>${esc(d.slice(5))}</small></div>`).join('')}</div><h3>Últimos exámenes y simulacros · nota / 10</h3>${recent.length?`<svg role="img" aria-label="Evolución de notas de exámenes y simulacros" viewBox="0 0 500 175"><text x="5" y="28" fill="currentColor">10</text><text x="10" y="149" fill="currentColor">0</text><path d="M30 25V145H480" stroke="var(--muted)" fill="none"/><polyline points="${points}" stroke="var(--brand)" fill="none" stroke-width="3"/>${recent.map((a,i)=>`<circle cx="${35+i*430/Math.max(1,recent.length-1)}" cy="${145-120*(Number(a.result.grade)/(a.scale||10))}" r="4" fill="var(--brand)"><title>${esc(a.testName||'Test')}: ${Number(a.result.grade).toFixed(2)}</title></circle>`).join('')}</svg>`:'<p class="muted">El gráfico aparecerá al terminar tu primer examen.</p>'}<details><summary>Datos de actividad</summary>${days.map((d,i)=>`<p>${d}: ${counts[i]} respuestas</p>`).join('')}</details></section>`);};
const delete12=delTest;delTest=async function(id){if(!confirm('¿Eliminar este test y sus sesiones pendientes? El historial de intentos se conservará.'))return;DB.tests=DB.tests.filter(t=>t.id!==id);Object.keys(DB.sessions).forEach(k=>{if(DB.sessions[k].t.id===id)delete DB.sessions[k];});await save();go('tests');};
window.addEventListener('pagehide',()=>{if(S)saveSession();});
document.addEventListener('visibilitychange',()=>{if(!S)return;if(document.hidden){S.activeMs=(S.activeMs||0)+(S.activeSince?Date.now()-S.activeSince:0);S.activeSince=0;saveSession();}else S.activeSince=Date.now();});

window.addEventListener('online',()=>R&&render());window.addEventListener('offline',()=>R&&render());if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});init();
