<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TestStudy">
<title>TestStudy</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#0f172a;--muted:#64748b;--brand:#2563eb;--ok:#16a34a;--bad:#dc2626;--warn:#d97706;--line:#e2e8f0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;background:#0f172a;color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;z-index:20}
header h1{font-size:18px;margin:0}
main{max-width:760px;margin:0 auto;padding:16px 16px 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(15,23,42,.05)}
h2{font-size:20px;margin:4px 0 12px}h3{margin:0 0 8px;font-size:16px}
button{font:inherit;border:0;border-radius:12px;padding:13px 16px;background:var(--brand);color:#fff;font-weight:600;cursor:pointer;width:100%}
button.secondary{background:#eef2ff;color:var(--brand)}button.ghost{background:#f1f5f9;color:var(--ink)}button.danger{background:#fee2e2;color:var(--bad)}
button:disabled{opacity:.5}
.row{display:flex;gap:10px}.row>*{flex:1}
input,select,textarea{font:inherit;width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);margin-bottom:10px}
label{display:block;font-size:13px;color:var(--muted);margin:8px 0 5px}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0;background:#fff;color:var(--ink);font-weight:500}
.opt.selected{border-color:var(--brand);background:#eff6ff}
.opt.correct{border-color:var(--ok);background:#f0fdf4}
.opt.wrong{border-color:var(--bad);background:#fef2f2}
.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;background:#eef2ff;color:var(--brand)}
.badge.gray{background:#f1f5f9;color:var(--muted)}.badge.green{background:#dcfce7;color:var(--ok)}.badge.red{background:#fee2e2;color:var(--bad)}.badge.amber{background:#fef3c7;color:var(--warn)}
.progress{height:8px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin:10px 0}.progress>div{height:100%;background:var(--brand)}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom)}
.nav button{background:none;color:var(--muted);border-radius:0;padding:10px 4px;font-size:11px;font-weight:600}.nav button.active{color:var(--brand)}
.muted{color:var(--muted);font-size:13px}.stat{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}.stat:last-child{border:0}
.hidden{display:none!important}
</style>
</head>
<body>
<header><h1>TestStudy</h1><span id="online" class="badge gray">local</span></header>
<main id="app"></main>
<nav class="nav" id="nav"></nav>
<script>
const LS='teststudy_v2';
const DEFAULT_DATA={tests:[],attempts:[],questionStats:{},favorites:[],settings:{penalty:0}};
let DB=load();
function load(){try{const d=JSON.parse(localStorage.getItem(LS));return d&&d.tests?d:structuredClone(DEFAULT_DATA)}catch(e){return structuredClone(DEFAULT_DATA)}}
function save(){localStorage.setItem(LS,JSON.stringify(DB))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const app=document.getElementById('app'),nav=document.getElementById('nav');
let route={name:'home'},session=null;
const SAMPLE={id:'sample-demo',category:'oficial',origin:'Datos de prueba',year:2025,type:'Demo',name:'Test ficticio de demostración',topic:'General',importedAt:new Date().toISOString(),reviewed:true,source:'Datos ficticios incluidos para probar la aplicación',scoring:{countable:5,pointsPerCorrect:1,penaltyPerWrong:0,blank:0,maxScore:5,scale:10},questions:[
{id:'q1',number:1,stem:'¿Cuál es la capital de Australia?',options:{A:'Sídney',B:'Canberra',C:'Melbourne',D:'Perth'},correct:'B',reserve:false,explanation:'Canberra fue diseñada como capital nacional.',status:'ok'},
{id:'q2',number:2,stem:'¿Qué organismo publica el Índice de Paz Global?',options:{A:'Naciones Unidas',B:'Institute for Economics and Peace',C:'OTAN',D:'Banco Mundial'},correct:'B',reserve:false,explanation:'',status:'ok'},
{id:'q3',number:3,stem:'¿Cuál es el océano más extenso?',options:{A:'Atlántico',B:'Índico',C:'Pacífico',D:'Ártico'},correct:'C',reserve:false,explanation:'',status:'ok'},
{id:'q4',number:4,stem:'¿Qué país tiene más habitantes?',options:{A:'China',B:'India',C:'Estados Unidos',D:'Indonesia'},correct:'B',reserve:false,explanation:'',status:'ok'},
{id:'q5',number:5,stem:'¿Cuál es la moneda de Japón?',options:{A:'Yuan',B:'Won',C:'Yen',D:'Rupia'},correct:'C',reserve:false,explanation:'',status:'ok'},
{id:'q6',number:101,stem:'Pregunta de reserva ficticia: ¿Qué tratado creó la ONU?',options:{A:'Tratado de Versalles',B:'Carta de las Naciones Unidas',C:'Tratado de Roma',D:'Tratado de Lisboa'},correct:'B',reserve:true,explanation:'',status:'ok'}]};
if(!DB.tests.length){DB.tests.push(SAMPLE);save()}
const VIEWS=[['home','Inicio'],['official','Oficiales'],['academy','Academias'],['all','Todos'],['failed','Falladas'],['favorites','Marcadas'],['stats','Estadísticas'],['manage','Importar'],['settings','Ajustes']];
function renderNav(){nav.innerHTML=VIEWS.map(([k,l])=>`<button class="${route.name===k?'active':''}" onclick="go('${k}')">${l}</button>`).join('')}
function go(name,params={}){route={name,...params};window.scrollTo(0,0);render()}
function testPath(t){return t.category==='oficial'?`Oficiales / ${t.year||'—'} / ${t.type||'General'}`:`Academias / ${t.origin||'—'} / ${t.year||'—'} / ${t.type||'General'}`}
function qStats(qid){return DB.questionStats[qid]||{seen:0,correct:0,wrong:0,blank:0,streakWrong:0,last:null}}
function recordAnswer(qid,result){const s=qStats(qid);s.seen++;s.last=new Date().toISOString();if(result==='correct'){s.correct++;s.streakWrong=0}else if(result==='wrong'){s.wrong++;s.streakWrong=0}else{s.blank++}DB.questionStats[qid]=s;save()}
function scoreAttempt(t,answers){const qs=t.questions.filter(q=>!q.reserve&&!q.annulled);let c=0,w=0,b=0;qs.forEach(q=>{const a=answers[q.id];if(!a)b++;else if(a===q.correct)c++;else w++});const sc=t.scoring||{};const countable=Math.min(sc.countable||qs.length,qs.length);const pc=sc.pointsPerCorrect??1,pw=sc.penaltyPerWrong??0;const raw=c*pc-w*pw;const max=sc.maxScore??countable*pc;const pct=max?Math.max(0,raw/max)*100:0;const grade=sc.scale?Math.max(0,pct/100*sc.scale):pct;return{correct:c,wrong:w,blank:b,raw,max,grade,pct,used:countable}}
function render(){renderNav();document.getElementById('online').textContent=navigator.onLine?'local':'sin conexión';const r=route;
if(session)return renderSession();
if(r.name==='home')return viewHome();if(r.name==='official')return viewList('oficial');if(r.name==='academy')return viewList('academia');
if(r.name==='all')return viewAll();if(r.name==='failed')return viewFailed();if(r.name==='favorites')return viewFavorites();
if(r.name==='stats')return viewStats();if(r.name==='manage')return viewManage();if(r.name==='settings')return viewSettings();
if(r.name==='test')return viewTest(r.id);if(r.name==='result')return viewResult();viewHome()}
function viewHome(){app.innerHTML=`<div class="card"><h2>Bienvenida</h2><p class="muted">Plataforma personal para estudiar con test de 100 preguntas y 5 de reserva. Los datos se guardan en este dispositivo.</p><div class="row"><button onclick="go('official')">Oficiales</button><button class="secondary" onclick="go('academy')">Academias</button></div></div><div class="card"><h3>Acceso rápido</h3><div class="row"><button class="ghost" onclick="go('failed')">Repasar falladas</button><button class="ghost" onclick="go('stats')">Estadísticas</button></div></div><div class="card"><h3>Resumen</h3><div class="stat"><span>Test importados</span><b>${DB.tests.length}</b></div><div class="stat"><span>Intentos realizados</span><b>${DB.attempts.length}</b></div><div class="stat"><span>Preguntas marcadas</span><b>${DB.favorites.length}</b></div></div>`}
function viewList(cat){const tests=DB.tests.filter(t=>t.category===cat);const years=[...new Set(tests.map(t=>t.year).filter(Boolean))].sort((a,b)=>b-a);
app.innerHTML=`<div class="card"><h2>${cat==='oficial'?'Exámenes oficiales':'Exámenes de academias'}</h2><input placeholder="Buscar..." value="${esc(route.q||'')}" oninput="route.q=this.value;render()"><select onchange="route.year=this.value;render()"><option value="">Todos los años</option>${years.map(y=>`<option ${String(route.year)===String(y)?'selected':''}>${y}</option>`).join('')}</select></div>`+
tests.filter(t=>(!route.q||JSON.stringify(t).toLowerCase().includes(route.q.toLowerCase()))&&(!route.year||String(t.year)===String(route.year))).map(t=>`<div class="card"><h3>${esc(t.name)}</h3><p class="muted">${esc(testPath(t))}</p><p><span class="badge">${t.questions.length} preguntas</span> <span class="badge gray">${t.questions.filter(q=>q.reserve).length} reserva</span> ${t.reviewed?'<span class="badge green">Revisado</span>':'<span class="badge amber">Pendiente</span>'}</p><div class="row"><button onclick="startTest('${t.id}','exam')">Examen</button><button class="secondary" onclick="startTest('${t.id}','study')">Estudio</button></div><div class="row" style="margin-top:10px"><button class="ghost" onclick="go('test',{id:'${t.id}'})">Ficha</button><button class="ghost" onclick="startTest('${t.id}','failed')">Falladas</button></div></div>`).join('')||'<div class="card"><p class="muted">No hay test. Importa uno desde «Importar».</p></div>'}
function viewAll(){app.innerHTML=`<div class="card"><h2>Todos los test</h2><input placeholder="Buscar..." value="${esc(route.q||'')}" oninput="route.q=this.value;render()"></div>`+DB.tests.filter(t=>!route.q||JSON.stringify(t).toLowerCase().includes(route.q.toLowerCase())).map(t=>`<div class="card" onclick="go('test',{id:'${t.id}'})"><h3>${esc(t.name)}</h3><p class="muted">${esc(testPath(t))} · ${t.questions.length} preguntas</p></div>`).join('')}
function viewTest(id){const t=DB.tests.find(x=>x.id===id);if(!t)return viewHome();const ats=DB.attempts.filter(a=>a.testId===t.id);const best=ats.length?Math.max(...ats.map(a=>a.result.grade)):null;
app.innerHTML=`<div class="card"><span class="badge">${t.category==='oficial'?'Oficial':'Academia'}</span> <span class="badge gray">${esc(t.year||'')}</span> ${t.reviewed?'<span class="badge green">Revisado</span>':'<span class="badge amber">Pendiente</span>'}<h2>${esc(t.name)}</h2><p class="muted">${esc(testPath(t))}</p><div class="stat"><span>Origen</span><b>${esc(t.origin||'—')}</b></div><div class="stat"><span>Preguntas</span><b>${t.questions.length}</b></div><div class="stat"><span>Reserva</span><b>${t.questions.filter(q=>q.reserve).length}</b></div><div class="stat"><span>Importado</span><b>${new Date(t.importedAt).toLocaleDateString('es-ES')}</b></div><div class="stat"><span>Origen de datos</span><b>${esc(t.source||'—')}</b></div><div class="stat"><span>Intentos / mejor nota</span><b>${ats.length} / ${best??'—'}</b></div></div><div class="card"><div class="row"><button onclick="startTest('${t.id}','exam')">Modo examen</button><button class="secondary" onclick="startTest('${t.id}','study')">Modo estudio</button></div><div class="row" style="margin-top:10px"><button class="ghost" onclick="startTest('${t.id}','failed')">Repasar falladas</button><button class="ghost" onclick="startTest('${t.id}','reserve')">Reservas</button></div></div><div class="card"><h3>Corrección</h3><div class="stat"><span>Puntuables</span><b>${t.scoring.countable}</b></div><div class="stat"><span>Acierto</span><b>${t.scoring.pointsPerCorrect}</b></div><div class="stat"><span>Penalización</span><b>${t.scoring.penaltyPerWrong}</b></div><div class="stat"><span>Escala</span><b>${t.scoring.scale||'porcentaje'}</b></div></div><div class="card"><h3>Gestión</h3><div class="row"><button class="ghost" onclick="editTest('${t.id}')">Editar</button><button class="danger" onclick="deleteTest('${t.id}')">Eliminar</button></div></div>`}
function startTest(id,mode){const t=DB.tests.find(x=>x.id===id);let qs=t.questions.slice();
if(mode==='failed')qs=qs.filter(q=>{const s=qStats(q.id);return s.wrong>0||s.blank>0});
if(mode==='reserve')qs=qs.filter(q=>q.reserve);
if(mode==='exam'||mode==='study')qs=qs.filter(q=>!q.reserve);
if(!qs.length)return alert('No hay preguntas disponibles para este modo.');
if(mode==='exam'&&confirm('¿Mezclar preguntas aleatoriamente?'))qs=qs.slice().sort(()=>Math.random()-0.5);
session={testId:id,mode,questions:qs,answers:{},marked:{},index:0,started:Date.now()};render()}
function renderSession(){const t=DB.tests.find(x=>x.id===session.testId),q=session.questions[session.index],a=session.answers[q.id],reveal=session.mode==='study'&&a,last=session.index===session.questions.length-1;
app.innerHTML=`<div class="card"><div class="row" style="align-items:center"><span class="badge">${session.mode==='exam'?'Examen':session.mode==='study'?'Estudio':session.mode==='failed'?'Falladas':'Reservas'}</span><span class="muted">${session.index+1} / ${session.questions.length}</span></div><div class="progress"><div style="width:${(session.index+1)/session.questions.length*100}%"></div></div><h3>${esc(q.stem)}</h3>${Object.entries(q.options).map(([k,v])=>`<button class="opt ${a===k?'selected':''} ${reveal?(k===q.correct?'correct':(a===k?'wrong':'')):''}" onclick="answer('${q.id}','${k}')">${k}) ${esc(v)}</button>`).join('')}${reveal?`<p class="muted"><b>${a===q.correct?'Correcta':'Incorrecta'}.</b> Respuesta: ${q.correct}. ${q.explanation?esc(q.explanation):''}</p>`:''}<div class="row"><button class="ghost" onclick="mark('${q.id}')">${session.marked[q.id]?'Quitar marca':'Marcar'}</button><button class="ghost" onclick="fav('${q.id}')">${DB.favorites.includes(q.id)?'Quitar favorita':'Favorita'}</button></div><div class="row" style="margin-top:10px"><button class="ghost" onclick="move(-1)" ${session.index===0?'disabled':''}>Anterior</button>${last?`<button onclick="${session.mode==='exam'?'confirmFinish()':'finish()'}">Terminar</button>`:`<button onclick="move(1)">Siguiente</button>`}</div>${session.mode==='exam'?`<button class="ghost" style="margin-top:10px" onclick="confirmFinish()">Entregar examen</button>`:''}</div>`}
function answer(qid,k){session.answers[qid]=k;if(session.mode==='study'){const q=DB.tests.find(t=>t.id===session.testId).questions.find(q=>q.id===qid);recordAnswer(qid,k===q.correct?'correct':'wrong')}save();render()}
function move(d){session.index=Math.min(session.questions.length-1,Math.max(0,session.index+d));render()}
function mark(qid){session.marked[qid]=!session.marked[qid];render()}
function fav(qid){const i=DB.favorites.indexOf(qid);i>=0?DB.favorites.splice(i,1):DB.favorites.push(qid);save();render()}
function confirmFinish(){if(confirm('¿Entregar el examen? Las preguntas sin respuesta contarán como en blanco.'))finish()}
function finish(){const t=DB.tests.find(x=>x.id===session.testId),result=scoreAttempt(t,session.answers);session.questions.forEach(q=>{const ans=session.answers[q.id];recordAnswer(q.id,!ans?'blank':ans===q.correct?'correct':'wrong')});const att={id:uid(),testId:t.id,mode:session.mode,date:new Date().toISOString(),durationSec:Math.round((Date.now()-session.started)/1000),answers:{...session.answers},result};DB.attempts.push(att);save();session=null;route={name:'result',attemptId:att.id};render()}
function viewResult(){const at=DB.attempts.find(a=>a.id===route.attemptId),t=DB.tests.find(x=>x.id===at.testId);
app.innerHTML=`<div class="card"><h2>Resultado</h2><p class="muted">${esc(t.name)}</p><div class="stat"><span>Aciertos</span><b>${at.result.correct}</b></div><div class="stat"><span>Errores</span><b>${at.result.wrong}</b></div><div class="stat"><span>En blanco</span><b>${at.result.blank}</b></div><div class="stat"><span>Puntuación bruta</span><b>${at.result.raw.toFixed(2)} / ${at.result.max}</b></div><div class="stat"><span>Nota</span><b>${at.result.grade.toFixed(2)}</b></div><div class="stat"><span>Duración</span><b>${Math.floor(at.durationSec/60)} min ${at.durationSec%60} s</b></div></div><div class="card"><h3>Corrección</h3>${t.questions.filter(q=>!q.reserve).map(q=>{const a=at.answers[q.id],ok=a===q.correct;return `<div style="border-top:1px solid var(--line);padding:10px 0"><b>${q.number}. ${esc(q.stem)}</b><br><span class="badge ${!a?'gray':ok?'green':'red'}">${!a?'En blanco':ok?'Correcta':'Incorrecta'}</span> <span class="muted">Correcta: ${q.correct}</span></div>`}).join('')}</div><div class="row"><button onclick="go('home')">Inicio</button><button class="secondary" onclick="go('failed')">Repasar falladas</button></div>`}
function viewFailed(){const items=[];DB.tests.forEach(t=>t.questions.forEach(q=>{const s=qStats(q.id);if(s.wrong>0||s.blank>0)items.push({t,q,s})}));
app.innerHTML=`<div class="card"><h2>Preguntas falladas</h2><p class="muted">Incluye errores históricos y preguntas dejadas en blanco.</p></div>`+items.map(({t,q,s})=>`<div class="card"><h3>${esc(q.stem)}</h3><p class="muted">${esc(t.name)} · ${esc(testPath(t))}</p><p><span class="badge">${s.correct} aciertos</span> <span class="badge red">${s.wrong} errores</span> ${s.streakWrong?`<span class="badge amber">${s.streakWrong} fallos seguidos</span>`:''}</p><div class="row"><button onclick="startTest('${t.id}','failed')">Practicar</button><button class="ghost" onclick="go('test',{id:'${t.id}'})">Ficha</button></div></div>`).join('')||'<div class="card"><p class="muted">Todavía no hay preguntas falladas.</p></div>'}
function viewFavorites(){const items=[];DB.tests.forEach(t=>t.questions.forEach(q=>{if(DB.favorites.includes(q.id))items.push({t,q})}));
app.innerHTML=`<div class="card"><h2>Preguntas marcadas</h2></div>`+items.map(({t,q})=>`<div class="card"><h3>${esc(q.stem)}</h3><p class="muted">${esc(t.name)}</p><div class="row"><button onclick="startTest('${t.id}','study')">Practicar</button><button class="ghost" onclick="fav('${q.id}')">Quitar</button></div></div>`).join('')||'<div class="card"><p class="muted">No has marcado preguntas.</p></div>'}
function viewStats(){const ats=DB.attempts;if(!ats.length){app.innerHTML='<div class="card"><h2>Estadísticas</h2><p class="muted">Realiza un test para generar estadísticas.</p></div>';return}
const grades=ats.map(a=>a.result.grade),answered=ats.reduce((n,a)=>n+a.result.correct+a.result.wrong,0),correct=ats.reduce((n,a)=>n+a.result.correct,0),wrong=ats.reduce((n,a)=>n+a.result.wrong,0),blank=ats.reduce((n,a)=>n+a.result.blank,0);
app.innerHTML=`<div class="card"><h2>Estadísticas</h2><div class="stat"><span>Test realizados</span><b>${ats.length}</b></div><div class="stat"><span>Nota media</span><b>${(grades.reduce((a,b)=>a+b,0)/grades.length).toFixed(2)}</b></div><div class="stat"><span>Mejor nota</span><b>${Math.max(...grades).toFixed(2)}</b></div><div class="stat"><span>Última nota</span><b>${grades[grades.length-1].toFixed(2)}</b></div><div class="stat"><span>Preguntas contestadas</span><b>${answered}</b></div><div class="stat"><span>% aciertos</span><b>${answered?(correct/answered*100).toFixed(1):0}%</b></div><div class="stat"><span>% errores</span><b>${answered?(wrong/answered*100).toFixed(1):0}%</b></div><div class="stat"><span>En blanco</span><b>${blank}</b></div></div><div class="card"><h3>Evolución</h3>${ats.slice(-10).map(a=>{const t=DB.tests.find(x=>x.id===a.testId);return `<div class="stat"><span>${esc(t.name)}<br><span class="muted">${new Date(a.date).toLocaleString('es-ES')}</span></span><b>${a.result.grade.toFixed(2)}</b></div>`}).join('')}</div><div class="card"><h3>Puntos débiles</h3>${Object.entries(DB.questionStats).map(([qid,s])=>({qid,s})).filter(x=>x.s.wrong>0).sort((a,b)=>b.s.streakWrong-a.s.streakWrong||b.s.wrong-a.s.wrong).slice(0,10).map(({qid,s})=>{let label='Pregunta',test=null;for(const t of DB.tests){const q=t.questions.find(q=>q.id===qid);if(q){label=q.number+'. '+q.stem;test=t;break}}return `<div class="stat"><span>${esc(label.slice(0,80))}<br><span class="muted">${esc(test?test.name:'')}</span></span><b>${s.wrong} errores</b></div>`}).join('')}</div>`}
function viewManage(){app.innerHTML=`<div class="card"><h2>Importar y gestionar</h2><p class="muted">Importa archivos JSON de test preparados y validados.</p><label>Archivo JSON de test</label><input type="file" id="file" accept=".json"><button onclick="importJSON()">Importar</button><button class="ghost" style="margin-top:10px" onclick="exportJSON()">Exportar copia de seguridad</button><button class="ghost" style="margin-top:10px" onclick="addEmptyTest()">Crear test manual</button></div><div class="card"><h3>Test importados</h3>${DB.tests.map(t=>`<div class="stat"><span>${esc(t.name)}<br><span class="muted">${esc(testPath(t))}</span></span><span><button class="ghost" style="width:auto;padding:8px 10px" onclick="go('test',{id:'${t.id}'})">Abrir</button></span></div>`).join('')}</div>`}
function importJSON(){const f=document.getElementById('file').files[0];if(!f)return alert('Selecciona un archivo JSON.');const r=new FileReader();r.onload=()=>{try{const data=JSON.parse(r.result),arr=Array.isArray(data)?data:[data];let n=0;arr.forEach(t=>{if(!t.id)t.id=uid();if(!t.importedAt)t.importedAt=new Date().toISOString();if(!t.questions||!Array.isArray(t.questions))throw new Error('El archivo no contiene preguntas válidas.');t.questions.forEach(q=>{if(!q.status)q.status='ok'});DB.tests.push(t);n++});save();alert(`Importados ${n} test.`);render()}catch(e){alert('Error: '+e.message)}};r.readAsText(f)}
function exportJSON(){const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='teststudy-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click()}
function addEmptyTest(){const name=prompt('Nombre del test:');if(!name)return;const t={id:uid(),category:'oficial',origin:'Manual',year:new Date().getFullYear(),type:'General',name,topic:'',importedAt:new Date().toISOString(),reviewed:false,source:'Creación manual',scoring:{countable:100,pointsPerCorrect:1,penaltyPerWrong:0,blank:0,maxScore:100,scale:10},questions:[]};DB.tests.push(t);save();editTest(t.id)}
function editTest(id){const t=DB.tests.find(x=>x.id===id);const name=prompt('Nombre:',t.name);if(name===null)return;const year=prompt('Año:',t.year);if(year===null)return;const origin=prompt(t.category==='oficial'?'Convocatoria / tipo:':'Academia:',t.origin);if(origin===null)return;const topic=prompt('Tema / materia:',t.topic||'');if(topic===null)return;const countable=prompt('Número de preguntas puntuables:',t.scoring.countable);if(countable===null)return;const penalty=prompt('Penalización por error (0 = sin penalización):',t.scoring.penaltyPerWrong);if(penalty===null)return;const scale=prompt('Escala de nota (vacío = porcentaje):',t.scoring.scale||'');if(scale===null)return;Object.assign(t,{name,year,origin,topic,scoring:{...t.scoring,countable:+countable||t.questions.length,penaltyPerWrong:+penalty||0,scale:+scale||null}});save();render()}
function deleteTest(id){if(!confirm('¿Eliminar este test? El historial de intentos se conservará.'))return;DB.tests=DB.tests.filter(t=>t.id!==id);save();go('manage')}
function viewSettings(){app.innerHTML=`<div class="card"><h2>Ajustes y copias</h2><p class="muted">Los datos se almacenan localmente en este navegador. No se envían a ningún servidor.</p><label>Penalización por defecto para nuevos test</label><input id="pen" type="number" step="0.01" value="${DB.settings.penalty}"><button onclick="DB.settings.penalty=+document.getElementById('pen').value||0;save();alert('Guardado.')">Guardar</button><button class="ghost" style="margin-top:10px" onclick="exportJSON()">Exportar copia de seguridad</button><label style="margin-top:14px">Restaurar copia de seguridad</label><input type="file" id="restore" accept=".json"><button class="danger" onclick="restoreBackup()">Restaurar y reemplazar datos</button></div>`}
function restoreBackup(){const f=document.getElementById('restore').files[0];if(!f)return alert('Selecciona una copia de seguridad.');if(!confirm('Esto reemplazará todos los datos actuales. ¿Continuar?'))return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.tests)throw new Error('Archivo no válido');DB=d;save();alert('Copia restaurada.');go('home')}catch(e){alert('Error: '+e.message)}};r.readAsText(f)}
window.addEventListener('online',render);window.addEventListener('offline',render);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script>
</body>
</html>
