<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Tests CD"><title>Tests CD</title><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.png"><style>
:root{--bg:#f6f7f9;--card:#ffffff;--ink:#111827;--muted:#6b7280;--brand:#4f46e5;--brand-soft:#eef2ff;--ok:#059669;--ok-soft:#ecfdf5;--bad:#dc2626;--bad-soft:#fef2f2;--warn:#d97706;--warn-soft:#fffbeb;--line:#eef0f4;--shadow:0 1px 3px rgba(16,24,40,.06),0 1px 2px rgba(16,24,40,.04)}
body.dark{--bg:#0f1115;--card:#1a1d23;--ink:#e5e7eb;--muted:#9ca3af;--brand:#818cf8;--brand-soft:#1e1b4b;--ok:#34d399;--ok-soft:#06281e;--bad:#f87171;--bad-soft:#2a1215;--warn:#fbbf24;--warn-soft:#291f05;--line:#262a33;--shadow:0 1px 3px rgba(0,0,0,.4)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;background:var(--bg);color:var(--ink);transition:background .25s,color .25s;-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:14px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.02em}
header h1 span{color:var(--brand)}
main{max-width:760px;margin:auto;padding:20px 18px 120px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
h2{font-size:22px;margin:2px 0 14px;font-weight:800;letter-spacing:-.03em}
h3{margin:0 0 8px;font-size:16px;font-weight:700;letter-spacing:-.01em}
button{font:inherit;border:0;border-radius:14px;padding:14px 18px;background:var(--brand);color:#fff;font-weight:600;width:100%;cursor:pointer;transition:transform .1s ease,box-shadow .15s ease,background .15s;box-shadow:0 1px 2px rgba(79,70,229,.25)}
button:active{transform:scale(.97)}
button.secondary{background:var(--brand-soft);color:var(--brand);box-shadow:none}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none}
button.danger{background:var(--bad-soft);color:var(--bad);box-shadow:none}
button:disabled{opacity:.4;box-shadow:none}
.row{display:flex;gap:10px}.row>*{flex:1}
input,select{font:inherit;width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);margin-bottom:10px;transition:border .15s}
input:focus,select:focus{outline:none;border-color:var(--brand)}
label{font-size:12px;color:var(--muted);display:block;margin:8px 0 5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;border:1.5px solid var(--line);border-radius:16px;padding:15px;margin:10px 0;background:var(--card);color:var(--ink);font-weight:500;line-height:1.45;transition:border-color .15s,background .15s;box-shadow:none}
.opt .ltr{flex:0 0 30px;height:30px;border-radius:10px;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.opt.sel{border-color:var(--brand);background:var(--brand-soft)}
.opt.sel .ltr{background:var(--brand);color:#fff}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .ltr{background:var(--ok);color:#fff}
.opt.ko{border-color:var(--bad);background:var(--bad-soft)}
.opt.ko .ltr{background:var(--bad);color:#fff}
.badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:99px;font-size:11px;font-weight:700;background:var(--brand-soft);color:var(--brand)}
.b-gray{background:var(--line);color:var(--muted)}.b-green{background:var(--ok-soft);color:var(--ok)}.b-red{background:var(--bad-soft);color:var(--bad)}.b-amber{background:var(--warn-soft);color:var(--warn)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 0}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),#818cf8);border-radius:99px;transition:width .25s ease}
.topbar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.topbar button{width:auto;padding:9px 14px;font-size:13px;border-radius:12px;box-shadow:none}
.topbar .tb-cur{background:var(--brand);color:#fff;font-weight:700;min-width:64px}
.tabs{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:22px;display:flex;z-index:40;padding:6px;box-shadow:0 8px 30px rgba(16,24,40,.12);width:min(92%,420px)}
.tabs button{background:none;color:var(--muted);border-radius:16px;padding:8px 4px;font-size:10px;font-weight:700;box-shadow:none;width:auto;flex:1}
.tabs button.on{background:var(--brand-soft);color:var(--brand)}
.tabs button:active{transform:scale(.95)}
.muted{color:var(--muted);font-size:13px;line-height:1.5}
.stat{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.stat:last-child{border:0}
.stat b{font-size:15px}
.sheet{position:fixed;inset:0;background:rgba(15,17,21,.5);z-index:50;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.inner{position:absolute;bottom:0;left:0;right:0;background:var(--card);border-radius:24px 24px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom));max-height:82vh;overflow:auto;box-shadow:0 -8px 40px rgba(0,0,0,.2)}
.inner button{margin-bottom:10px}
.drawer{position:fixed;inset:0;background:rgba(15,17,21,.5);z-index:60;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.dpanel{position:absolute;top:0;left:0;bottom:0;width:84%;max-width:340px;background:var(--card);padding:20px;overflow:auto;border-radius:0 24px 24px 0;box-shadow:8px 0 40px rgba(0,0,0,.2)}
.dpanel h3{font-size:17px;margin-bottom:12px}
.dgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:16px}
.dgrid button{padding:11px 2px;font-size:13px;border-radius:12px;box-shadow:none;font-weight:700}
.g-ans{background:var(--brand-soft);color:var(--brand)}
.g-mark{background:var(--warn-soft);color:var(--warn)}
.g-blank{background:var(--line);color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.grid button{padding:10px 2px;font-size:12px;border-radius:10px;box-shadow:none}
</style></head><body><header><h1>Tests <span>CD</span></h1><span id="net" class="badge b-gray">local</span></header><main id="app"></main>
<nav class="tabs" id="tabs"></nav><div id="modal"></div>
<script>
const DEF={tests:[],attempts:[],qs:{},favs:[],set:{penalty:0,dark:false}};let DB=null,S=null,R={name:'home'},busy=false,timerId=null;
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&','<':'<','>':'>','"':'"',"'":'&#39;'}[c]))}
const app=document.getElementById('app'),tabs=document.getElementById('tabs'),modal=document.getElementById('modal');
const DEMO={id:'demo',category:'oficial',origin:'Datos de prueba',year:2025,type:'Demo',name:'Test ficticio de demostración',topic:'General',importedAt:new Date().toISOString(),reviewed:true,source:'Datos ficticios',scoring:{countable:5,pointsPerCorrect:1,penaltyPerWrong:0,blank:0,maxScore:5,scale:10},questions:[
{id:'d1',number:1,stem:'¿Cuál es la capital de Australia?',options:{A:'Sídney',B:'Canberra',C:'Melbourne',D:'Perth'},correct:'B',reserve:false,explanation:'Canberra fue diseñada como capital.'},
{id:'d2',number:2,stem:'¿Qué organismo publica el Índice de Paz Global?',options:{A:'Naciones Unidas',B:'Institute for Economics and Peace',C:'OTAN',D:'Banco Mundial'},correct:'B',reserve:false},
{id:'d3',number:3,stem:'¿Cuál es el océano más extenso?',options:{A:'Atlántico',B:'Índico',C:'Pacífico',D:'Ártico'},correct:'C',reserve:false},
{id:'d4',number:4,stem:'¿Qué país tiene más habitantes?',options:{A:'China',B:'India',C:'Estados Unidos',D:'Indonesia'},correct:'B',reserve:false},
{id:'d5',number:5,stem:'¿Cuál es la moneda de Japón?',options:{A:'Yuan',B:'Won',C:'Yen',D:'Rupia'},correct:'C',reserve:false},
{id:'d6',number:101,stem:'Reserva ficticia: ¿Qué tratado creó la ONU?',options:{A:'Tratado de Versalles',B:'Carta de las Naciones Unidas',C:'Tratado de Roma',D:'Tratado de Lisboa'},correct:'B',reserve:true}]};
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('testscd',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function idbGet(db,k){return new Promise((res,rej)=>{const t=db.transaction('kv','readonly').objectStore('kv').get(k);t.onsuccess=()=>res(t.result);t.onerror=()=>rej(t.error)})}
function idbPut(db,k,v){return new Promise((res,rej)=>{const t=db.transaction('kv','readwrite').objectStore('kv').put(k,v);t.onsuccess=()=>res();t.onerror=()=>rej(t.error)})}
let db=null;
async function save(){if(db)try{await idbPut(db,'db',DB)}catch(e){console.warn(e)}}
async function saveSession(){if(db&&S)await idbPut(db,'session',S)}
async function clearSession(){if(db)await idbPut(db,'session',null)}
async function init(){db=await openDB();const d=await idbGet(db,'db');DB=d&&d.tests?d:{tests:[DEMO],attempts:[],qs:{},favs:[],set:{penalty:0,dark:false}};if(!DB.tests.length)DB.tests=[DEMO];applyDark();const sv=await idbGet(db,'session');if(sv&&sv.q){if(confirm('Tienes un test sin terminar: '+sv.t.name+'. ¿Retomarlo?')){S=sv;R={name:'quiz'}}else await clearSession()}await save();render()}
const TABS=[['home','Inicio','🏠'],['tests','Test','📚'],['failed','Falladas','🔁'],['stats','Datos','📊'],['more','Más','☰']];
function tabsRender(){tabs.innerHTML=TABS.map(([k,l,i])=>`<button class="${(R.name==k||(k=='tests'&&(R.name=='official'||R.name=='academy'||R.name=='all'||R.name=='test')))?'on':''}" onclick="${k=='more'?'more()':`go('${k}')`}">${i}<br>${l}</button>`).join('')}
function go(n,p={}){if(busy)return;busy=true;closeModal();R={name:n,...p};window.scrollTo({top:0,behavior:'smooth'});setTimeout(()=>{render();busy=false},70)}
function path(t){return `${t.category=='oficial'?'Oficial':'Academia'} · ${t.origin||'—'} · ${t.year||'—'}`}
function qs(id){return DB.qs[id]||{seen:0,correct:0,wrong:0,blank:0,streak:0,last:null}}
function rec(id,r){const s=qs(id);s.seen++;s.last=new Date().toISOString();if(r=='ok'){s.correct++;s.streak=0}else if(r=='ko'){s.wrong++;s.streak++}else{s.blank++}DB.qs[id]=s;save()}
function score(t,a){const q=t.questions.filter(x=>!x.reserve);let c=0,w=0,b=0;q.forEach(x=>{const v=a[x.id];if(!v)b++;else if(v==x.correct)c++;else w++});const sc=t.scoring,raw=c*(sc.pointsPerCorrect??1)-w*(sc.penaltyPerWrong??0),max=sc.maxScore??sc.countable*(sc.pointsPerCorrect??1),pct=max?Math.max(0,raw/max)*100:0;return{correct:c,wrong:w,blank:b,raw,max,grade:sc.scale?Math.max(0,pct/100*sc.scale):pct}}
function attempts(t){return DB.attempts.filter(a=>a.testId==t.id)}
function lastResult(t){const a=attempts(t);return a.length?a[a.length-1].result:null}
function applyDark(){document.body.classList.toggle('dark',!!(DB&&DB.set.dark))}
function render(){if(!DB)return;applyDark();tabsRender();document.getElementById('net').textContent=navigator.onLine?'local':'sin conexión';const r=R;if(S)return quiz();if(r.name=='home')return home();if(r.name=='tests')return library();if(r.name=='official')return library('oficial');if(r.name=='academy')return library('academia');if(r.name=='all')return library();if(r.name=='failed')return failed();if(r.name=='favorites')return favs();if(r.name=='stats')return stats();if(r.name=='manage')return manage();if(r.name=='settings')return settings();if(r.name=='test')return detail(r.id);if(r.name=='result')return result();home()}
function home(){const done=DB.attempts,g=done.map(a=>a.result.grade);app.innerHTML=`<div class="card"><h2>Hola 👋</h2><p class="muted">Tu biblioteca de tests para preparar la Carrera Diplomática. Todo se guarda en este dispositivo.</p><div class="row"><button onclick="go('tests')">Biblioteca</button><button class="secondary" onclick="go('failed')">Repasar falladas</button></div></div><div class="card"><h3>Resumen</h3><div class="stat"><span>Test en la biblioteca</span><b>${DB.tests.length}</b></div><div class="stat"><span>Intentos realizados</span><b>${done.length}</b></div><div class="stat"><span>Nota media</span><b>${g.length?(g.reduce((a,b)=>a+b,0)/g.length).toFixed(2):'—'}</b></div><div class="stat"><span>Mejor nota</span><b>${g.length?Math.max(...g).toFixed(2):'—'}</b></div></div><div class="card"><h3>Últimos test</h3>${DB.tests.slice(-5).reverse().map(t=>{const lr=lastResult(t);return `<div class="stat"><span>${esc(t.name)}<br><span class="muted">${esc(path(t))}</span></span><b>${lr?lr.grade.toFixed(2):'—'}</b></div>`}).join('')}</div>`}
function library(cat){let ts=DB.tests.filter(t=>!cat||t.category==cat);const q=(R.q||'').toLowerCase(),y=R.year||'',o=R.origin||'',tp=R.topic||'',sort=R.sort||'recent';
if(q)ts=ts.filter(t=>JSON.stringify(t).toLowerCase().includes(q));if(y)ts=ts.filter(t=>String(t.year)==String(y));if(o)ts=ts.filter(t=>t.origin==o);if(tp)ts=ts.filter(t=>t.topic==tp);
if(sort=='best')ts=[...ts].sort((a,b)=>(lastResult(b)?.grade??-1)-(lastResult(a)?.grade??-1));else if(sort=='worst')ts=[...ts].sort((a,b)=>(lastResult(a)?.grade??99)-(lastResult(b)?.grade??99));else ts=[...ts].sort((a,b)=>new Date(b.importedAt)-new Date(a.importedAt));
const years=[...new Set(DB.tests.map(t=>t.year).filter(Boolean))].sort((a,b)=>b-a),origins=[...new Set(DB.tests.map(t=>t.origin).filter(Boolean))],topics=[...new Set(DB.tests.map(t=>t.topic).filter(Boolean))];
app.innerHTML=`<div class="card"><h2>${cat=='oficial'?'Oficiales':cat=='academia'?'Academias':'Biblioteca'}</h2><input placeholder="Buscar test, academia, tema..." value="${esc(R.q||'')}" oninput="R.q=this.value;render()"><div class="row"><select onchange="R.year=this.value;render()"><option value="">Año</option>${years.map(x=>`<option ${String(y)==String(x)?'selected':''}>${x}</option>`).join('')}</select><select onchange="R.origin=this.value;render()"><option value="">Academia</option>${origins.map(x=>`<option ${o==x?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="row"><select onchange="R.topic=this.value;render()"><option value="">Materia</option>${topics.map(x=>`<option ${tp==x?'selected':''}>${esc(x)}</option>`).join('')}</select><select onchange="R.sort=this.value;render()"><option value="recent" ${sort=='recent'?'selected':''}>Recientes</option><option value="best" ${sort=='best'?'selected':''}>Mejor nota</option><option value="worst" ${sort=='worst'?'selected':''}>Peor nota</option></select></div></div>`+ts.map(t=>{const lr=lastResult(t),f=t.questions.filter(q=>qs(q.id).wrong>0).length;return `<div class="card" onclick="go('test',{id:'${t.id}'})"><h3>${esc(t.name)}</h3><p class="muted">${esc(path(t))}${t.topic?' · '+esc(t.topic):''}</p><p style="margin:10px 0 0"><span class="badge">${t.questions.length} preg.</span> <span class="badge b-gray">${t.questions.filter(q=>q.reserve).length} reserva</span> ${lr?`<span class="badge ${lr.grade>=5?'b-green':'b-red'}">Última: ${lr.grade.toFixed(2)}</span>`:'<span class="badge b-amber">Sin hacer</span>'} ${f?`<span class="badge b-red">${f} falladas</span>`:''}</p></div>`}).join('')||'<div class="card"><p class="muted">No hay test que coincidan.</p></div>'}
function detail(id){const t=DB.tests.find(x=>x.id==id),A=attempts(t),best=A.length?Math.max(...A.map(a=>a.result.grade)):null,f=t.questions.filter(q=>qs(q.id).wrong>0).length;app.innerHTML=`<div class="card"><span class="badge">${t.category=='oficial'?'Oficial':'Academia'}</span> <span class="badge b-gray">${esc(t.year||'')}</span> ${t.reviewed?'<span class="badge b-green">Revisado</span>':'<span class="badge b-amber">Pendiente</span>'}<h2>${esc(t.name)}</h2><p class="muted">${esc(path(t))}${t.topic?' · '+esc(t.topic):''}</p><div class="stat"><span>Preguntas / reservas</span><b>${t.questions.length} / ${t.questions.filter(q=>q.reserve).length}</b></div><div class="stat"><span>Intentos / mejor nota</span><b>${A.length} / ${best??'—'}</b></div><div class="stat"><span>Última nota</span><b>${A.length?A[A.length-1].result.grade.toFixed(2):'—'}</b></div><div class="stat"><span>Importado</span><b>${new Date(t.importedAt).toLocaleDateString('es-ES')}</b></div></div><div class="card"><div class="row"><button onclick="start('${t.id}','exam')">Examen</button><button class="secondary" onclick="start('${t.id}','study')">Estudio</button></div><div class="row" style="margin-top:10px"><button class="ghost" onclick="start('${t.id}','failed')">Falladas</button><button class="ghost" onclick="start('${t.id}','reserve')">Reservas</button></div></div><div class="card"><h3>Historial</h3>${A.slice().reverse().map(a=>`<div class="stat"><span>${new Date(a.date).toLocaleString('es-ES')}<br><span class="muted">${a.mode} · ${a.result.correct}✓ ${a.result.wrong}✗ ${a.result.blank}○</span></span><b>${a.result.grade.toFixed(2)}</b></div>`).join('')||'<p class="muted">Sin intentos.</p>'}</div><div class="card"><div class="row"><button class="ghost" onclick="editTest('${t.id}')">Editar</button><button class="danger" onclick="delTest('${t.id}')">Eliminar</button></div></div>`}
function start(id,m){const t=DB.tests.find(x=>x.id==id);let q=t.questions.slice();if(m=='failed')q=q.filter(x=>{const s=qs(x.id);return s.wrong||s.blank}).sort((a,b)=>(qs(b.id).streak-qs(a.id).streak)||(qs(b.id).wrong-qs(a.id).wrong));if(m=='reserve')q=q.filter(x=>x.reserve);if(m=='exam'||m=='study')q=q.filter(x=>!x.reserve);if(!q.length)return alert('No hay preguntas para este modo.');
let timer=0;if(m=='exam'){const v=prompt('Minutos de temporizador (0 = sin límite):','0');timer=+v||0}
if(m=='exam'&&confirm('¿Mezclar preguntas?'))q=[...q].sort(()=>Math.random()-.5);
S={t,m,q,a:{},mark:{},i:0,t0:Date.now(),deadline:timer?Date.now()+timer*60000:0};R={name:'quiz'};render()}
function quiz(){const t=S.t,q=S.q[S.i],a=S.a[q.id],show=S.m=='study'&&a,last=S.i==S.q.length-1;
app.innerHTML=`<div class="card"><div class="topbar"><button class="ghost" onclick="jump(${S.i-1})" ${S.i==0?'disabled':''}>◀ ${S.i}</button><button class="tb-cur" onclick="sidePanel()">☰ ${S.i+1}</button><button class="ghost" onclick="jump(${S.i+1})" ${last?'disabled':''}>${S.i+2} ▶</button><span id="timer" class="badge b-gray"></span></div><div class="bar"><div style="width:${(S.i+1)/S.q.length*100}%"></div></div><div id="qa"><h3 style="font-size:17px;line-height:1.5;margin-bottom:14px">${esc(q.stem)}</h3>${Object.entries(q.options).map(([k,v])=>`<button id="o${k}" class="opt ${a==k?'sel':''} ${show?(k==q.correct?'ok':a==k?'ko':''):''}" onclick="pick('${k}')"><span class="ltr">${k}</span><span>${esc(v)}</span></button>`).join('')}${show?`<p class="muted" style="margin-top:14px"><b>${a==q.correct?'✅ Correcta':'❌ Incorrecta'}.</b> Respuesta: ${q.correct}. ${esc(q.options[q.correct]||'')}<br>${q.explanation?esc(q.explanation):''}</p><button class="ghost" onclick="editExp()">Editar explicación</button>`:''}</div><div class="row" style="margin-top:16px"><button class="ghost" onclick="mark()">${S.mark[q.id]?'Quitar marca':'Marcar'}</button><button class="ghost" onclick="fav()">${DB.favs.includes(q.id)?'Quitar':'Favorita'}</button></div><div class="row" style="margin-top:10px"><button class="ghost" onclick="move(-1)" ${S.i==0?'disabled':''}>← Anterior</button>${last?`<button onclick="review()">Revisar y entregar</button>`:`<button onclick="move(1)">Siguiente →</button>`}</div><div class="row" style="margin-top:10px"><button class="ghost" onclick="sidePanel()">☰ Navegador</button><button class="ghost" onclick="saveExit()">💾 Guardar y salir</button><button class="danger" onclick="discardExit()">✕ Descartar</button></div>${S.m=='exam'?`<button class="ghost" style="margin-top:10px" onclick="review()">Entregar</button>`:''}</div>`;startTimer()}
function pick(k){if(!S)return;const q=S.q[S.i];S.a[q.id]=k;document.querySelectorAll('.opt').forEach(b=>b.classList.remove('sel','ok','ko'));document.getElementById('o'+k).classList.add('sel');if(S.m=='study'){rec(q.id,k==q.correct?'ok':'ko');Object.keys(q.options).forEach(x=>{const b=document.getElementById('o'+x);if(x==q.correct)b.classList.add('ok');else if(x==k)b.classList.add('ko')});const p=document.createElement('p');p.className='muted';p.style.marginTop='14px';p.innerHTML=`<b>${k==q.correct?'✅ Correcta':'❌ Incorrecta'}.</b> Respuesta: ${q.correct}. ${esc(q.options[q.correct]||'')}<br>${q.explanation?esc(q.explanation):''}`;document.getElementById('qa').appendChild(p)}save();saveSession()}
function move(d){if(busy)return;busy=true;S.i=Math.min(S.q.length-1,Math.max(0,S.i+d));window.scrollTo({top:0,behavior:'smooth'});setTimeout(()=>{quiz();busy=false},90);saveSession()}
function mark(){const q=S.q[S.i];S.mark[q.id]=!S.mark[q.id];quiz();saveSession()}
function fav(){const q=S.q[S.i],i=DB.favs.indexOf(q.id);i>=0?DB.favs.splice(i,1):DB.favs.push(q.id);save();quiz()}
function editExp(){const q=S.q[S.i],v=prompt('Explicación:',q.explanation||'');if(v==null)return;q.explanation=v;save();quiz()}
function sidePanel(){const g=S.q.map((q,i)=>{const a=S.a[q.id];const cls=a?'g-ans':(S.mark[q.id]?'g-mark':'g-blank');return `<button class="${cls}" onclick="jump(${i})">${i+1}</button>`}).join('');modal.innerHTML=`<div class="drawer" onclick="if(event.target==this)closeModal()"><div class="dpanel"><h3>Preguntas</h3><div class="dgrid">${g}</div><button class="secondary" onclick="closeModal()">Cerrar</button></div></div>`}
function jump(i){if(i<0||i>=S.q.length)return;S.i=i;closeModal();quiz();saveSession()}
function saveExit(){if(confirm('¿Guardar y salir? Podrás retomar el test más tarde.')){saveSession();S=null;go('tests')}}
function discardExit(){if(confirm('¿Descartar este intento?')){S=null;clearSession();go('tests')}}
function review(){const blank=S.q.filter(q=>!S.a[q.id]).length,marked=S.q.filter(q=>S.mark[q.id]).length;modal.innerHTML=`<div class="sheet" onclick="if(event.target==this)closeModal()"><div class="inner"><h3>Revisar antes de entregar</h3><div class="stat"><span>Respondidas</span><b>${S.q.length-blank}</b></div><div class="stat"><span>En blanco</span><b>${blank}</b></div><div class="stat"><span>Marcadas</span><b>${marked}</b></div><button class="ghost" onclick="jumpFirst('blank')">Ir a la primera en blanco</button><button class="ghost" onclick="jumpFirst('mark')">Ir a la primera marcada</button><button onclick="confirmEnd()">Entregar</button><button class="secondary" onclick="closeModal()">Seguir</button></div></div>`}
function jumpFirst(kind){const i=S.q.findIndex(q=>kind=='blank'?!S.a[q.id]:S.mark[q.id]);if(i>=0)jump(i);else closeModal()}
function confirmEnd(){if(confirm('¿Entregar? Las sin respuesta contarán como en blanco.'))end()}
function end(){const r=score(S.t,S.a);S.q.forEach(q=>{const v=S.a[q.id];rec(q.id,!v?'blank':v==q.correct?'ok':'ko')});const at={id:uid(),testId:S.t.id,mode:S.m,date:new Date().toISOString(),duration:Math.round((Date.now()-S.t0)/1000),answers:{...S.a},result:r};DB.attempts.push(at);save();S=null;clearSession();R={name:'result',id:at.id};render()}
function result(){const at=DB.attempts.find(x=>x.id==R.id),t=DB.tests.find(x=>x.id==at.testId);app.innerHTML=`<div class="card"><h2>Resultado</h2><p class="muted">${esc(t.name)}</p><div class="stat"><span>Aciertos</span><b>${at.result.correct}</b></div><div class="stat"><span>Errores</span><b>${at.result.wrong}</b></div><div class="stat"><span>Blancos</span><b>${at.result.blank}</b></div><div class="stat"><span>Nota</span><b>${at.result.grade.toFixed(2)}</b></div><div class="stat"><span>Duración</span><b>${Math.floor(at.duration/60)} min ${at.duration%60} s</b></div></div><div class="card"><h3>Corrección</h3>${t.questions.filter(q=>!q.reserve).map(q=>{const a=at.answers[q.id],ok=a==q.correct;return `<div style="border-top:1px solid var(--line);padding:12px 0"><b>${q.number}. ${esc(q.stem)}</b><br><span class="badge ${!a?'b-gray':ok?'b-green':'b-red'}">${!a?'Blanco':ok?'Correcta':'Incorrecta'}</span><br><span class="muted">Tu respuesta: ${a?esc(q.options[a]||a):'—'}</span><br><span class="muted">Correcta: ${q.correct}. ${esc(q.options[q.correct]||'')}</span></div>`}).join('')}</div><div class="row"><button onclick="go('home')">Inicio</button><button class="secondary" onclick="go('failed')">Falladas</button></div>`}
function failed(){const items=[];DB.tests.forEach(t=>t.questions.forEach(q=>{const s=qs(q.id);if(s.wrong||s.blank)items.push({t,q,s})}));const y=R.year||'',o=R.origin||'';const years=[...new Set(items.map(x=>x.t.year))].sort((a,b)=>b-a),origins=[...new Set(items.map(x=>x.t.origin))];
items.sort((a,b)=>(b.s.streak-a.s.streak)||(b.s.wrong-a.s.wrong));
app.innerHTML=`<div class="card"><h2>Preguntas falladas</h2><div class="row"><select onchange="R.year=this.value;render()"><option value="">Todos los años</option>${years.map(x=>`<option ${String(y)==String(x)?'selected':''}>${x}</option>`).join('')}</select><select onchange="R.origin=this.value;render()"><option value="">Todas</option>${origins.map(x=>`<option ${o==x?'selected':''}>${esc(x)}</option>`).join('')}</select></div></div>`+items.filter(x=>(!y||String(x.t.year)==String(y))&&(!o||x.t.origin==o)).map(({t,q,s})=>`<div class="card"><h3>${esc(q.stem)}</h3><p class="muted">${esc(t.name)} · ${esc(path(t))}</p><p style="margin:10px 0"><span class="badge b-green">${s.correct} aciertos</span> <span class="badge b-red">${s.wrong} errores</span> ${s.streak?`<span class="badge b-amber">${s.streak} seguidos</span>`:''}</p><div class="row"><button onclick="start('${t.id}','failed')">Practicar</button><button class="ghost" onclick="go('test',{id:'${t.id}'})">Ficha</button></div></div>`).join('')||'<div class="card"><p class="muted">No hay fallos.</p></div>'}
function favs(){const items=[];DB.tests.forEach(t=>t.questions.forEach(q=>{if(DB.favs.includes(q.id))items.push({t,q})}));app.innerHTML=`<div class="card"><h2>Marcadas</h2></div>`+items.map(({t,q})=>`<div class="card"><h3>${esc(q.stem)}</h3><p class="muted">${esc(t.name)}</p><div class="row"><button onclick="start('${t.id}','study')">Practicar</button><button class="ghost" onclick="unfav('${q.id}')">Quitar</button></div></div>`).join('')||'<div class="card"><p class="muted">Nada marcado.</p></div>'}
function unfav(id){DB.favs=DB.favs.filter(x=>x!=id);save();render()}
function stats(){const A=DB.attempts;if(!A.length)return app.innerHTML='<div class="card"><h2>Datos</h2><p class="muted">Haz un test para generar estadísticas.</p></div>';const g=A.map(a=>a.result.grade),ans=A.reduce((n,a)=>n+a.result.correct+a.result.wrong,0),c=A.reduce((n,a)=>n+a.result.correct,0),w=A.reduce((n,a)=>n+a.result.wrong,0),b=A.reduce((n,a)=>n+a.result.blank,0);
const byYear={},byOrigin={};A.forEach(a=>{const t=DB.tests.find(x=>x.id==a.testId);if(!t)return;(byYear[t.year]??=[]).push(a.result.grade);(byOrigin[t.origin||'—']??=[]).push(a.result.grade)});
const avg=x=>x.reduce((a,b)=>a+b,0)/x.length;
app.innerHTML=`<div class="card"><h2>Datos</h2><div class="stat"><span>Intentos</span><b>${A.length}</b></div><div class="stat"><span>Nota media</span><b>${(g.reduce((x,y)=>x+y,0)/g.length).toFixed(2)}</b></div><div class="stat"><span>Mejor</span><b>${Math.max(...g).toFixed(2)}</b></div><div class="stat"><span>Última</span><b>${g[g.length-1].toFixed(2)}</b></div><div class="stat"><span>Aciertos / errores</span><b>${c} / ${w}</b></div><div class="stat"><span>Blancos</span><b>${b}</b></div></div><div class="card"><h3>Por año</h3>${Object.entries(byYear).sort((a,b)=>b[0]-a[0]).map(([y,v])=>`<div class="stat"><span>${y}</span><b>${avg(v).toFixed(2)} · ${v.length} intentos</b></div>`).join('')}</div><div class="card"><h3>Por academia / origen</h3>${Object.entries(byOrigin).map(([o,v])=>`<div class="stat"><span>${esc(o)}</span><b>${avg(v).toFixed(2)} · ${v.length} intentos</b></div>`).join('')}</div><div class="card"><h3>Últimos intentos</h3>${A.slice(-10).reverse().map(a=>{const t=DB.tests.find(x=>x.id==a.testId);return `<div class="stat"><span>${esc(t.name)}<br><span class="muted">${new Date(a.date).toLocaleString('es-ES')}</span></span><b>${a.result.grade.toFixed(2)}</b></div>`}).join('')}</div>`}
function manage(){app.innerHTML=`<div class="card"><h2>Importar</h2><p class="muted">Selecciona uno o varios archivos JSON a la vez. Se avisará si un test ya existe.</p><label>Archivos JSON</label><input type="file" id="f" accept=".json" multiple><button onclick="imp()">Importar</button><button class="ghost" style="margin-top:10px" onclick="exp()">Exportar copia de seguridad</button><button class="ghost" style="margin-top:10px" onclick="expCSV()">Exportar resultados (CSV)</button></div><div class="card"><h3>Test</h3>${DB.tests.map(t=>`<div class="stat"><span>${esc(t.name)}<br><span class="muted">${esc(path(t))}</span></span><button class="ghost" style="width:auto;padding:9px 14px" onclick="go('test',{id:'${t.id}'})">Abrir</button></div>`).join('')}</div>`}
function imp(){const files=[...document.getElementById('f').files];if(!files.length)return alert('Selecciona uno o varios JSON.');let added=0,skipped=0,done=0;files.forEach(f=>{const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result),arr=Array.isArray(d)?d:[d];arr.forEach(t=>{if(!t.id)t.id=uid();if(!t.importedAt)t.importedAt=new Date().toISOString();const dup=DB.tests.find(x=>x.name==t.name&&String(x.year)==String(t.year)&&x.origin==t.origin);if(dup){if(!confirm('Ya existe un test con el mismo nombre, año y origen. ¿Importar otra copia?')){skipped++;return}}DB.tests.push(t);added++})}catch(e){alert('Error en '+f.name+': '+e.message)}done++;if(done==files.length){save();alert(`Importados ${added}. Omitidos ${skipped}.`);render()}};r.readAsText(f)})}
function exp(){const b=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='tests-cd-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click()}
function expCSV(){let csv='fecha;test;modo;nota;aciertos;errores;blancos;duracion_seg\n';DB.attempts.forEach(a=>{const t=DB.tests.find(x=>x.id==a.testId);csv+=`"${a.date}";"${(t?t.name:'').replace(/"/g,'""')}";${a.mode};${a.result.grade.toFixed(2)};${a.result.correct};${a.result.wrong};${a.result.blank};${a.duration}\n`});const b=new Blob([csv],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='tests-cd-resultados.csv';a.click()}
function settings(){app.innerHTML=`<div class="card"><h2>Ajustes</h2><p class="muted">Los datos se guardan localmente en este iPhone mediante IndexedDB.</p><button class="ghost" onclick="toggleDark()">${DB.set.dark?'☀️ Modo claro':'🌙 Modo oscuro'}</button><button class="ghost" style="margin-top:10px" onclick="exp()">Exportar copia de seguridad</button><button class="ghost" style="margin-top:10px" onclick="expCSV()">Exportar resultados (CSV)</button><label>Restaurar copia</label><input type="file" id="r" accept=".json"><button class="danger" onclick="rest()">Restaurar</button></div>`}
function rest(){const f=document.getElementById('r').files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.tests)throw 0;DB=d;save();applyDark();go('home')}catch(e){alert('Archivo no válido')}};r.readAsText(f)}
function editTest(id){const t=DB.tests.find(x=>x.id==id),n=prompt('Nombre:',t.name);if(n==null)return;const y=prompt('Año:',t.year);if(y==null)return;const o=prompt('Academia / organismo:',t.origin);if(o==null)return;const tp=prompt('Materia:',t.topic||'');if(tp==null)return;const p=prompt('Penalización:',t.scoring.penaltyPerWrong);if(p==null)return;Object.assign(t,{name:n,year:y,origin:o,topic:tp,scoring:{...t.scoring,penaltyPerWrong:+p||0}});save();render()}
function delTest(id){if(confirm('¿Eliminar test? El historial se conservará.')){DB.tests=DB.tests.filter(t=>t.id!=id);save();go('tests')}}
function more(){modal.innerHTML=`<div class="sheet" onclick="if(event.target==this)closeModal()"><div class="inner"><h3>Más</h3><button class="ghost" onclick="closeModal();go('official')">Oficiales</button><button class="ghost" onclick="closeModal();go('academy')">Academias</button><button class="ghost" onclick="closeModal();go('all')">Todos los test</button><button class="ghost" onclick="closeModal();go('favorites')">Marcadas</button><button class="ghost" onclick="closeModal();go('manage')">Importar</button><button class="ghost" onclick="closeModal();go('settings')">Ajustes</button><button class="secondary" onclick="closeModal()">Cerrar</button></div></div>`}
function closeModal(){modal.innerHTML=''}
let timerInt=null;function startTimer(){if(timerInt)clearInterval(timerInt);if(!S||!S.deadline)return;timerInt=setInterval(()=>{const el=document.getElementById('timer');if(!el)return;const left=Math.max(0,S.deadline-Date.now());const m=Math.floor(left/60000),s=Math.floor(left%60000/1000);el.textContent=`⏱ ${m}:${String(s).padStart(2,'0')}`;if(left<=0){clearInterval(timerInt);alert('Tiempo terminado. Revisa y entrega.')}},1000)}
const _quiz=quiz;quiz=function(){_quiz();startTimer()};
window.addEventListener('online',()=>R&&render());window.addEventListener('offline',()=>R&&render());if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});init();
</script></body></html>
